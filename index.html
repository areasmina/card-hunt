<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#262a2b">
<script>try{var t=JSON.parse(localStorage.getItem('cardhunt2.theme')||'"dark"');document.documentElement.dataset.theme=t==='light'?'light':'dark'}catch(e){document.documentElement.dataset.theme='dark'}</script>
<title>Card Hunt</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Card Hunt">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Search five Canadian MTG stores at once, save favorites, wishlists and decks.">
<style>
:root{
  /* Dark: colours taken from an Alpha black card (Demonic Tutor). Slate frame for the page and panels,
     parchment from the text box for the words, the art's deep red for buttons, the parchment tan for links.
     Light: Nord Snow Storm surfaces with Polar Night text, and the same red.
     --accent fills buttons, --accent-ink is accent-coloured text. ok, warn, heart are status colours. */
  --bg:#262a2b; --surface:#303536; --surface-2:#3a4041; --surface-3:#474e4e; --text:#efe2cb; --muted:#c9b495;
  --line:#3a4041; --accent:#8a3b33; --accent-text:#f4e7d1; --accent-ink:#d9ba97; --ok:#a3be8c; --warn:#e0b86a; --heart:#c8584c;
  --sheet-bg:#262a2b; --sheet:#303536; --sheet-2:#3a4041; --sheet-text:#efe2cb; --sheet-muted:#c9b495;
  --shadow:0 8px 28px rgba(0,0,0,.35); --r:24px;
  color-scheme:dark;   /* scrollbars and form controls follow the theme (Firefox kept a white scrollbar) */
}
:root[data-theme="light"]{
  --bg:#e5e9f0; --surface:#eceff4; --surface-2:#d8dee9; --surface-3:#d8dee9; --text:#2e3440; --muted:#4c566a;
  --line:#d8dee9; --accent:#793c37; --accent-text:#f4e7d1; --accent-ink:#793c37; --ok:#4f7a3a; --warn:#9a6a10; --heart:#bf616a; --shadow:0 8px 28px rgba(46,52,64,.14);
  color-scheme:light;
}
html{background:var(--bg);scrollbar-color:var(--surface-3) var(--bg)}
/* Vintage texture: the old card frame, greyed and almost hidden under the theme colour, on the page only.
   To turn it off, delete this block (or set --tex:none). */
:root{--tex:url(textures/frame-tutor.jpg); --veil:rgba(38,42,43,.9); --veil-sheet:rgba(38,42,43,.82)}   /* dark: the beaded frame of an Alpha black card (Demonic Tutor), kept subtle */
:root[data-theme="light"]{--tex:url(textures/frame-white.jpg); --veil:rgba(229,233,240,.94); --veil-sheet:rgba(229,233,240,.84)}
body{min-height:100vh;min-height:100dvh}
body,.top,.stools{background-color:var(--bg);background-image:linear-gradient(var(--veil),var(--veil)),var(--tex);background-size:auto,340px;background-attachment:fixed}
.sheet .body:not(.cartsheet .body){background-image:linear-gradient(var(--veil-sheet),var(--veil-sheet)),var(--tex);background-size:auto,340px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background-color:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
svg{display:block}
.app{max-width:760px;margin:0 auto;padding:12px 16px calc(104px + env(safe-area-inset-bottom))}
.lrail .lcard{flex:none;width:170px}
.hidden{display:none!important}

/* search pill */
.top{position:sticky;top:0;z-index:15;background-color:var(--bg);padding:8px 0 6px;margin:0 -16px;padding-left:16px;padding-right:16px;display:flex;gap:10px;align-items:center}
.top .pill{flex:1;min-width:0}

.pill{display:flex;align-items:center;gap:10px;background:var(--surface-2);border-radius:999px;padding:0 14px;height:52px;position:relative}
.pill input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font:inherit;font-size:18px}
.pill input::-webkit-search-cancel-button,.pill input::-webkit-search-decoration{-webkit-appearance:none;display:none}
.pill .x{width:26px;height:26px;border-radius:50%;background:var(--surface-3);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.suggest{position:absolute;left:0;right:0;top:58px;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;z-index:20}
.suggest button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 16px}
.suggest button.on,.suggest button:hover{background:var(--surface-2)}
.suggest .muted{color:var(--muted)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;height:42px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:0 16px;font-size:15px;font-weight:500}
.chip.icon{width:50px;justify-content:center;padding:0}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.chip.off{opacity:.45;text-decoration:line-through}

/* headings */
.h{display:flex;align-items:center;gap:8px;margin:22px 0 12px}
.h h2{margin:0;font-size:24px;letter-spacing:-.02em}
.h .more{width:28px;height:28px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center}
.h .right{margin-left:auto;font-size:15px;color:var(--accent-ink);font-weight:600}
.sub{color:var(--muted);font-size:14px;margin:-6px 0 12px}

/* product grid */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 14px}
@media (min-width:620px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.p{min-width:0}
.p .img{touch-action:manipulation;-webkit-user-select:none;user-select:none;position:relative;display:block;width:100%;aspect-ratio:1/1;border-radius:var(--r);overflow:hidden;background:var(--surface-2)}
.p .img img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
.p .img .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;color:var(--muted);font-size:14px}
.heart{position:absolute;right:10px;bottom:10px;width:44px;height:44px;border-radius:50%;background:rgba(80,80,90,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;color:#fff}
.heart.on{color:var(--heart);background:rgba(255,255,255,.92)}
.heart svg{transition:transform .15s}
.heart:active svg{transform:scale(.85)}
.heart.pop svg{animation:pop .45s cubic-bezier(.2,1.8,.4,1)}
@keyframes pop{0%{transform:scale(.5)}55%{transform:scale(1.35)}100%{transform:scale(1)}}
.burst{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;color:#fff;z-index:2}
.burst svg{width:46%;height:auto;filter:drop-shadow(0 6px 18px rgba(0,0,0,.35));animation:burst .9s ease-out forwards}
.burst.off{color:rgba(255,255,255,.9)}
@keyframes burst{0%{transform:scale(.2);opacity:0}15%{transform:scale(1.2);opacity:1}30%{transform:scale(.92)}45%{transform:scale(1.04)}75%{transform:scale(1);opacity:1}100%{transform:scale(1.15) translateY(-12px);opacity:0}}
@media (prefers-reduced-motion: reduce){.heart.pop svg,.burst svg{animation:none}.burst{display:none}}
.tag{position:absolute;left:10px;bottom:10px;background:var(--ok);color:#fff;border-radius:999px;padding:3px 9px;font-weight:600;font-size:12px}
.tag.sold{background:rgba(20,20,24,.7)}
.p .meta{padding:8px 2px 0}
.p .store{color:var(--muted);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p .title{font-weight:650;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p .price{font-weight:700;font-size:17px;margin-top:2px}
.p.out .img{opacity:.55}

/* horizontal rail */
.rail{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 4px}
.rail::-webkit-scrollbar{display:none}
.rail .p{flex:none;width:132px}
.lrail .lcard{flex:none;width:140px}
.bchips{margin-top:6px}
.rail .p .img{border-radius:14px;aspect-ratio:488/680}
.rail .p .img img{object-fit:cover;object-position:center}
.rail .heart{width:38px;height:38px;right:8px;bottom:8px}

/* rows */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:14px;padding:10px 0;text-align:left;width:100%}
.row .ic{width:60px;height:60px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;flex:none;color:var(--muted);overflow:hidden}
.row .ic.sq{border-radius:14px}
.row .ic img{width:100%;height:100%;object-fit:cover;object-position:top}
.row .t{font-size:17px;font-weight:550}
.row .s{font-size:15px;color:var(--muted)}
.row .grow{flex:1;min-width:0}
.row .grow .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* cards (lists) */
.lcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.lcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:8px}
.lcard .stack{display:flex;height:70px}
.lcard .stack img,.lcard .stack .blank{width:50px;height:70px;border-radius:8px;object-fit:cover;object-position:top;margin-right:-18px;border:2px solid var(--surface);background:var(--surface-2)}
.lcard .n{font-weight:650}
.lcard .c{font-size:14px;color:var(--muted)}
.newcard{align-items:center;justify-content:center;color:var(--accent-ink);font-weight:600;border-style:dashed;min-height:132px}

/* segmented */

/* list detail */
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.li img,.li .blank{width:46px;height:64px;border-radius:7px;object-fit:cover;object-position:top;background:var(--surface-2);flex:none}
.li .grow{flex:1;min-width:0}
.li .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .b{font-size:14px;color:var(--ok);font-weight:600}
.li .b.none{color:var(--warn)}
.li .b.wait{color:var(--muted);font-weight:400}
.stepper{display:flex;align-items:center;gap:2px;background:var(--surface-2);border-radius:999px;height:36px;padding:0 4px}
.stepper button{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.stepper span{min-width:18px;text-align:center;font-weight:600}
.field{display:flex;gap:8px;margin:12px 0;position:relative}
.field input,.field textarea{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--surface);color:var(--text);border-radius:14px;padding:12px 14px;font:inherit;outline:0}
.field textarea{min-height:130px;resize:vertical}
.field .suggest{top:52px}
.btn{height:48px;border-radius:999px;padding:0 20px;background:var(--accent);color:var(--accent-text);font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn{transition:transform .12s}
a.btn{text-decoration:none}
.btn.ghost{background:var(--surface-2);color:var(--text);font-weight:550}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.titleedit{font-size:26px;font-weight:700;letter-spacing:-.02em;border:0;background:transparent;color:var(--text);outline:0;width:100%;padding:0;margin:6px 0 2px}
.total{display:flex;justify-content:space-between;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-top:16px;font-weight:650}
.empty{color:var(--muted);text-align:center;padding:30px 16px}
.skel{aspect-ratio:1/1;border-radius:var(--r);background:var(--surface-2);animation:pulse 1.2s ease-in-out infinite}
.skel.t{aspect-ratio:auto;height:14px;border-radius:7px;margin-top:10px;width:70%}
@keyframes pulse{50%{opacity:.45}}
.note{color:var(--muted);font-size:13px;margin-top:18px}
.buy{margin-top:18px}
.btn.big{height:58px;font-size:18px;border-radius:18px}
.incart{display:flex;align-items:center;gap:12px;background:var(--surface-2);border-radius:18px;padding:8px 8px 8px 18px;min-height:58px}
.incart>div:first-child{flex:1;display:flex;flex-direction:column}
.incart b{font-size:17px}
.incart>div:first-child span{font-size:13px;color:var(--muted)}
.bigstep{display:flex;align-items:center;gap:4px;background:var(--surface);border-radius:14px;padding:4px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.bigstep button{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--text);transition:transform .12s,background .15s}
.bigstep button:last-child{background:var(--accent);color:var(--accent-text)}
.bigstep button svg{width:20px;height:20px}
.bigstep span{min-width:34px;text-align:center;font-size:20px;font-weight:750;font-variant-numeric:tabular-nums}
.bigstep span.bump{animation:bump .25s}
@keyframes bump{40%{transform:scale(1.35)}}
.soldnote{text-align:center;color:var(--warn);font-weight:600;padding:14px;background:var(--surface-2);border-radius:18px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.tile2{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;height:78px;border-radius:18px;background:var(--surface-2);color:var(--text);font-size:13.5px;font-weight:600;text-decoration:none;transition:transform .12s}
.tile2.on{color:var(--heart)}
.tile2.on span{color:var(--text)}
.btn,.tile2,.bigstep button,.sbub,.chip,.promo{-webkit-tap-highlight-color:transparent}
.btn:active,.tile2:active,.bigstep button:active,.sbub:active,.promo:active,.chip:active{transform:scale(.95)}
@media (prefers-reduced-motion: reduce){.btn:active,.tile2:active,.bigstep button:active,.sbub:active,.promo:active,.chip:active{transform:none}.bigstep span.bump{animation:none}}
.ci .ciimg{flex:none;padding:0;display:block;border-radius:12px;overflow:hidden}
.ci button.nm{text-align:left;color:inherit;padding:0;font:inherit}
.h .hint{margin-left:auto;color:var(--muted);font-size:14px}
.srail{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 6px}
.srail::-webkit-scrollbar{display:none}
.sbub{flex:none;width:72px;display:flex;flex-direction:column;align-items:center;gap:6px}
.sbub .logo,.sthead .logo{position:relative;width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:24px;color:#fff}
.logo.haslogo{border:1px solid rgba(0,0,0,.08)}
.logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:9%;border-radius:50%;background:#fff}
.sbub .logo.add{background:var(--surface-2);color:var(--accent-ink);border:1.5px dashed var(--line)}
.sbub .logo i{position:absolute;right:-2px;bottom:-2px;width:22px;height:22px;border-radius:50%;background:var(--ok);color:#fff;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg)}
.sbub .nm{font-size:12.5px;line-height:1.2;text-align:center;color:var(--text);max-width:72px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sbub.off .logo{filter:grayscale(1);opacity:.45}
.sbub.off .nm{color:var(--muted);text-decoration:line-through}
.sthead{display:flex;align-items:center;gap:14px;margin:6px 0 10px}
.sthead h2{margin:0;font-size:22px}
.switch{flex:none;width:50px;height:30px;border-radius:999px;background:var(--surface-3);position:relative;transition:background .2s}
.switch i{position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.switch.on{background:var(--ok)}
.switch.on i{transform:translateX(20px)}
.hello{display:flex;align-items:center;gap:8px;padding:14px 0 2px}
.hello>div{flex:1;min-width:0}
.hello h1{margin:0;font-size:30px;letter-spacing:-.03em;line-height:1.1}
.hello .hlogo{flex:none;display:block;margin-right:4px}
.hello .hlogo img{display:block;height:56px;width:56px;image-rendering:pixelated}
.hello p{margin:2px 0 0;color:var(--muted);font-size:15px}
.iconbtn{position:relative;width:44px;height:44px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--text);flex:none}
.iconbtn.on{color:var(--accent-ink)}
.iconbtn i{position:absolute;top:9px;right:9px;width:9px;height:9px;border-radius:50%;background:var(--ok);border:2px solid var(--surface-2)}
.recent{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:4px -16px 0;padding:6px 16px 2px}
.recent::-webkit-scrollbar{display:none}
.recent .chip{height:38px;font-size:14px;padding:0 14px}
.recent .chip.clear{padding:0;width:38px;justify-content:center;color:var(--muted)}
.promo{display:flex;align-items:center;gap:14px;width:100%;text-align:left;margin-top:18px;padding:16px;border-radius:22px;background:var(--accent);color:var(--accent-text)}
.promo .ic{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;flex:none}
.promo .ic svg{width:24px;height:24px}
.promo .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.promo b{font-size:17px}
.promo .grow span{font-size:14px;opacity:.85}
.promo.soft{background:var(--surface);color:var(--text);border:1.5px solid var(--line)}
.promo.soft .ic{background:var(--surface-2);color:var(--accent-ink)}
.promo.soft .grow span{color:var(--muted);opacity:1}
.row>svg{color:var(--muted);flex:none}
.syncs .code{font:700 20px/1.3 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.04em;background:var(--surface-2);border-radius:16px;padding:16px;text-align:center;margin:10px 0 4px;word-break:break-all;user-select:all}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.links a{font-size:13px;text-decoration:none;background:var(--surface-2);border-radius:999px;padding:6px 11px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;gap:10px;padding:10px 16px calc(14px + env(safe-area-inset-bottom));pointer-events:none}
.navpill{pointer-events:auto;display:flex;align-items:center;gap:4px;background:var(--surface);border-radius:999px;padding:6px;box-shadow:var(--shadow)}
.navpill button{width:58px;height:54px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.navpill button.on{background:var(--surface-2);color:var(--text)}
.cartbtn{pointer-events:auto;width:66px;height:66px;border-radius:50%;background:var(--accent);color:var(--accent-text);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);position:relative}
.cartbtn span{position:absolute;top:14px;right:12px;font-size:12px;font-weight:800;background:#fff;color:var(--accent);border-radius:999px;padding:0 5px;min-width:18px;text-align:center}

/* sheets */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet .scrim{position:absolute;inset:0;background:rgba(0,0,0,.5);animation:fadein .28s ease-out}
.sheet .body{animation:slideup .38s cubic-bezier(.22,1,.36,1);transition:transform .25s cubic-bezier(.22,1,.36,1);will-change:transform}
.sheet.closing{pointer-events:none}
.sheet.closing .scrim{animation:fadeout .22s ease-in forwards}
.sheet.closing .body{animation:slidedown .22s ease-in forwards}
@keyframes fadein{from{opacity:0}}
@keyframes fadeout{to{opacity:0}}
@keyframes slideup{from{transform:translateY(100%)}}
@keyframes slidedown{to{transform:translateY(100%)}}
@media (prefers-reduced-motion: reduce){.sheet .scrim,.sheet .body{animation:none}}
.sheet .body{position:relative;width:100%;max-width:760px;max-height:92vh;overflow-y:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:14px 16px calc(28px + env(safe-area-inset-bottom))}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--surface-3);margin:0 auto 12px}
.sheet .close{position:absolute;right:14px;top:14px;width:38px;height:38px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center}
.pd .big:not(.btn){height:min(36vh,460px);width:auto;max-width:100%;margin:6px auto 0;display:block;border-radius:18px;aspect-ratio:488/680;object-fit:cover;background:var(--surface-2)}
.missnote{display:flex;gap:10px;align-items:center;margin-top:12px;padding:10px 12px;border-radius:14px;background:var(--surface-2);font-size:13px;color:var(--muted)}.missnote a{color:var(--accent-ink);font-weight:600}.missnote svg{flex:none}
.pd .store{color:var(--muted);margin-top:12px;font-size:14px}

const API = 'https://card-hunt.areasmina.workers.dev';

// ---------- sync across devices ----------
// Each person gets a secret sync code. Every device that has the code shares the same favorites, lists and cart.
const SYNCED=['favs','cart','viewed','searches','lists','temp','myStores','deckOv','addrOv'];
let SY=LS.get('sync',null);            // {code, at (last server version we have), dirty}
let syncState='idle', syncT=null, syncBusy=false;
const ALPH='abcdefghjkmnpqrstuvwxyz23456789';
const newCode=()=>[...crypto.getRandomValues(new Uint8Array(20))].map(b=>ALPH[b%ALPH.length]).join('');
const cleanCode=c=>String(c||'').toLowerCase().replace(/[^a-z0-9]/g,'');
const prettyCode=c=>c.match(/.{1,4}/g).join('-');
const syncLink=c=>`${location.origin}${location.pathname}#sync/${c}`;
const snapshot=()=>Object.fromEntries(SYNCED.map(k=>[k,S[k]]));
const saveSY=()=>LS.set('sync',SY);
function markDirty(){ if(!SY) return; SY.dirty=true; saveSY(); clearTimeout(syncT); syncT=setTimeout(syncNow,3000); }
function unionBy(a,b,key,pick){ const m=new Map(); for(const x of [...(a||[]),...(b||[])]){ const k=key(x); m.set(k, m.has(k)?(pick?pick(m.get(k),x):m.get(k)):x); } return [...m.values()]; }
function mergeItems(a,b){ return unionBy(a,b,i=>i.name.toLowerCase(),(x,y)=>({...x,qty:Math.max(x.qty,y.qty)})); }
function mergeData(a,b){ // a = this device, b = the cloud; nothing is lost from either side
  return {
    favs: unionBy(a.favs,b.favs,o=>o.url),
    cart: unionBy(a.cart,b.cart,o=>o.url,(x,y)=>({...x,qty:Math.max(x.qty,y.qty),added:x.added||y.added})),
    viewed: unionBy(a.viewed,b.viewed,o=>o.url).sort((x,y)=>(y.at||0)-(x.at||0)).slice(0,60),
    searches: unionBy(a.searches,b.searches,x=>x.q.toLowerCase(),(x,y)=>x.at>y.at?x:y).sort((x,y)=>y.at-x.at).slice(0,20),
    lists: unionBy(a.lists,b.lists,l=>l.id,(x,y)=>({...((x.at||0)>=(y.at||0)?x:y),items:mergeItems(x.items,y.items)})),
    myStores: unionBy(a.myStores,b.myStores,x=>x.host),
    deckOv: {...(b.deckOv||{}),...(a.deckOv||{})},
    addrOv: {...(b.addrOv||{}),...(a.addrOv||{})},
    temp: {...(a.temp||b.temp||{id:'temp',name:'Card list'}), items:mergeItems(a.temp&&a.temp.items,b.temp&&b.temp.items)},
  };
}
function applyData(d){
  for(const k of SYNCED) if(d[k]!=null){ S[k]=d[k]; LS.set(k,S[k]); }
  rebuildStores();
  if(!Array.isArray(S.lists)||!S.lists.length){ S.lists=[{id:'wish',name:'Wishlist',items:[],at:Date.now()}]; LS.set('lists',S.lists); }
}
async function cloudGet(code){ const r=await fetch(`${API}/sync/${code}`,{cache:'no-store'}); if(r.status===404) return null; if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }
async function cloudPut(code,data,keepalive){ const at=Date.now(); const r=await fetch(`${API}/sync/${code}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({at,data}),keepalive:!!keepalive}); if(!r.ok) throw new Error('HTTP '+r.status); return at; }
function setSyncState(st){ syncState=st; const el=$id('syncstatus'); if(el) el.textContent=syncLabel(); }
function syncLabel(){
  if(!SY) return 'Off. Turn on to see your cards on every device';
  if(syncState==='busy') return 'Syncing…';
  if(syncState==='err') return "Couldn't sync, will retry";
  return SY.at?`On, synced ${ago(SY.at).toLowerCase()}`:'On';
}
// Pull the cloud copy; if this device also changed, merge both; then push if anything is new here.
async function syncNow(){
  if(!SY) return; if(syncBusy){ clearTimeout(syncT); syncT=setTimeout(syncNow,2000); return; } syncBusy=true; clearTimeout(syncT); setSyncState('busy');
  try{
    const remote=await cloudGet(SY.code); let changed=false;
    if(remote && remote.at>(SY.at||0)){
      applyData(SY.dirty?mergeData(snapshot(),remote.data):remote.data); SY.at=remote.at; changed=true;
      if(!SY.dirty) saveSY();
    }
    if(SY.dirty||!remote){ SY.dirty=false; saveSY(); try{ SY.at=await cloudPut(SY.code,snapshot()); }catch(e){ SY.dirty=true; throw e; } }
    saveSY(); setSyncState('ok');
    if(changed){ render(); if($id('sheet').querySelector('.cartsheet')) openCart(); }
  }catch(e){ setSyncState('err'); clearTimeout(syncT); syncT=setTimeout(syncNow,30000); }
  finally{ syncBusy=false; }
}
async function turnOnSync(){
  SY={code:newCode(),at:0,dirty:true}; saveSY(); await syncNow();
  if(syncState==='err'){ SY=null; LS.set('sync',null); toast("Couldn't reach the sync service. Try again"); } else toast('Sync is on');
  openSync();
}
async function linkCode(raw){
  const code=cleanCode(raw); if(code.length<16){ toast("That doesn't look like a sync code"); return; }
  setSyncState('busy');
  let remote; try{ remote=await cloudGet(code); }catch(e){ setSyncState('err'); toast("Couldn't reach the sync service. Try again"); return; }
  if(!remote){ setSyncState('idle'); toast("We couldn't find that sync code"); return; }
  applyData(mergeData(snapshot(),remote.data)); SY={code,at:remote.at,dirty:true}; saveSY();
  await syncNow(); render(); toast('This device is synced'); openSync();
}

function parseLine(line){
  let s=line.trim();

  let qty=1; const m=s.match(/^(\d+)\s*x?\s+(.*)$/i); if(m){qty=+m[1];s=m[2]}
  s=s.replace(/\s*\*[^*]*\*\s*/g,' ').replace(/\s*\([A-Za-z0-9]{2,6}\)\s*[\w★-]*\s*$/,'').replace(/\s*\[[^\]]*\]\s*$/,'').replace(/\s+#\S+$/,'').trim();
  return s?{qty,name:s}:null;
}
function parseList(text){

  for(const l of String(text).split('\n')){const p=parseLine(l);if(!p)continue;const k=p.name.toLowerCase();
    if(map.has(k))map.get(k).qty+=p.qty;else map.set(k,p)}

async function fetchCard(name){
  const k=name.toLowerCase();
  if(DATA[k]?.state==='ok' && Date.now()-DATA[k].at<10*60e3) return DATA[k];
  DATA[k]={state:'loading',offers:[]}; render();
  try{
    // Ask in groups of 6 stores at a time, so every one of your stores gets searched however many you add.
    const hosts=S.myStores.map(m=>m.host), groups=[null];
    for(let i=0;i<hosts.length;i+=6) groups.push(hosts.slice(i,i+6));
    const parts=await Promise.all(groups.map(async g=>{
      const u=g?`${API}/search?q=${encodeURIComponent(name)}&stores=_&extra=${encodeURIComponent(g.join(','))}`:`${API}/search?q=${encodeURIComponent(name)}`;
      try{ const r=await fetch(u); if(!r.ok) throw new Error('HTTP '+r.status); return await r.json(); }
      catch(e){ return {results:[],errors:(g?g.map(h=>'x:'+h):BUILTIN.map(b=>b.id)).map(store=>({store,error:String(e.message||e)}))}; }
    }));
    const j={results:parts.flatMap(x=>x.results||[]),errors:parts.flatMap(x=>x.errors||[])};
    // When some store has the exact card, close matches from the others (another card with that word in its name) are dropped.
    if(j.results.some(x=>x.exact)) j.results=j.results.filter(x=>x.exact||x.exact===undefined);
    if(!j.results.length&&j.errors.length&&j.errors.length>=STORES.length) throw new Error('No store answered');
    const offers=(j.results||[]).map(p=>remember({store:p.store, storeName:(SBY[p.store]&&SBY[p.store].name)||p.storeName, title:p.title, name:p.name||name, set:p.set, url:p.url,
      image:p.image, foil:isFoil(p.title), price:p.priceMin??0, priceMax:p.priceMax??p.priceMin??0, available:!!p.available}));
    DATA[k]={state:'ok',offers,errors:j.errors||[],at:Date.now()};
  }catch(e){ DATA[k]={state:'err',offers:[],error:String(e.message||e)}; }
  render(); return DATA[k];
}
async function fetchMany(names){

}
function filtered(offers){

// Stores in the circle, from the bundled list plus anything a live lookup found, nearest first.
function nearRefresh(){
  const at={lat:NEAR.lat,lon:NEAR.lon}; if(nearMap){ const c=nearMap.getCenter(); at.lat=c.lat; at.lon=c.lng; }
  const g=$id('gmaps'); if(g) g.href=`https://www.google.com/maps/search/trading+card+game+store/@${at.lat.toFixed(4)},${at.lon.toFixed(4)},12z`;
  const live=(nearRes&&nearRes.live)||[], seen=new Set(), all=[];
  // Your Card Hunt stores come first, placed where their own website says they are (always up to date).
  const norm=x=>String(x||'').toLowerCase().replace(/^the\s+/,'').replace(/[^a-z0-9]/g,'');
  const mineGeo=STORES.flatMap(st=>locsOf(st).map(l=>({name:st.name,lat:l.lat,lon:l.lon,website:storeHome(st),addr:l.address,mine:st.id,shop:'games'})));
  const isMine=s=>mineGeo.some(m=>{ const h=hostOf(s.website); return (h&&h===hostOf(m.website))||(norm(s.name).startsWith(norm(m.name))&&norm(m.name).length>3); });
  for(const s of mineGeo){ const d=km(at,s); if(d<=NEAR.r) all.push({...s,d}); seen.add(s.name.toLowerCase()+'|'+s.lat.toFixed(3)); }
  for(const s of [...(CA||[]),...live]){ if(isMine(s)) continue; const k=s.name.toLowerCase()+'|'+s.lat.toFixed(3); if(seen.has(k)) continue; seen.add(k); const d=km(at,s); if(d<=NEAR.r) all.push({...s,d}); }
  all.sort((a,b)=>(!!b.mine-!!a.mine)||a.d-b.d);
  nearRes={at,stores:all.slice(0,80),live,total:all.length,noData:!CA&&!live.length};
  const n=$id('nres'); if(n) n.innerHTML=nearListHTML(); drawMarkers();
}
function locateMe(quiet){
  if(!navigator.geolocation){ if(!quiet) toast("This browser can't share your location"); return; }
  navigator.geolocation.getCurrentPosition(p=>{ if(nearMap){ nearMap.setView([p.coords.latitude,p.coords.longitude],11); } },
    ()=>{ if(!quiet) toast("Couldn't get your location. Move the map by hand instead"); },{enableHighAccuracy:false,timeout:10000,maximumAge:600000});
}
function km(a,b){ const R=6371, t=x=>x*Math.PI/180, dl=t(b.lat-a.lat), dn=t(b.lon-a.lon);
  return 2*R*Math.asin(Math.sqrt(Math.sin(dl/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dn/2)**2)); }

function doSearch(q){

  searchQ=q; S.searches=[{q,at:Date.now()},...S.searches.filter(s=>s.q.toLowerCase()!==q.toLowerCase())].slice(0,12); save('searches');

function autocomplete(input, box, onPick){
  let items=[], idx=-1, t, req=0;
  const hide=()=>{box.classList.add('hidden');items=[];idx=-1};
  const show=()=>{ if(!items.length) return hide();
    box.innerHTML=items.map((n,i)=>`<button type="button" class="${i===idx?'on':''}" data-n="${esc(n)}"><span class="muted">${I.search}</span>${esc(n)}</button>`).join('');
    box.classList.remove('hidden');
    box.querySelectorAll('button').forEach(b=>b.onmousedown=e=>{e.preventDefault();hide();onPick(b.dataset.n)}); };
  input.addEventListener('input',()=>{ clearTimeout(t); const q=input.value.trim(); if(q.length<2) return hide();
    t=setTimeout(async()=>{const id=++req; try{const r=await fetch('https://api.scryfall.com/cards/autocomplete?q='+encodeURIComponent(q));const j=await r.json();
      if(id!==req)return; items=(j.data||[]).slice(0,7); idx=-1; show()}catch(e){hide()}},150)});
  input.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'&&items.length){e.preventDefault();idx=(idx+1)%items.length;show()}
    else if(e.key==='ArrowUp'&&items.length){e.preventDefault();idx=(idx-1+items.length)%items.length;show()}
    else if(e.key==='Enter'){e.preventDefault();const v=idx>=0?items[idx]:input.value;hide();onPick(v)}
    else if(e.key==='Escape')hide();});
  input.addEventListener('blur',()=>setTimeout(hide,120));
}

// Panels slide up when they open and slide down when they close. Updating an open panel (a cart stepper, the

function sheet(html, cls=''){
  const cur=$id('sheet').querySelector('.sheet');
  if(cur){ const same=cur.dataset.cls===cls; const b=cur.querySelector('.body'), top=b.scrollTop;
    cur.className=`sheet ${cls}`; cur.dataset.cls=cls; b.innerHTML=html; if(same) b.scrollTop=top; else b.scrollTop=0; return; }
  $id('sheet').innerHTML=`<div class="sheet ${cls}" data-cls="${cls}"><div class="scrim" data-act="close"></div><div class="body">${html}</div></div>`;
  document.body.style.overflow='hidden'; dragToClose($id('sheet').querySelector('.body'));

function closeSheet(){

  cur.classList.add('closing'); document.body.appendChild(cur);

  setTimeout(()=>cur.remove(),240);

document.addEventListener('click',e=>{ if(dragMoved){ dragMoved=false; e.preventDefault(); e.stopImmediatePropagation(); } },true);
document.addEventListener('dragstart',e=>{ if(e.target.closest&&e.target.closest(HROW)) e.preventDefault(); });
document.addEventListener('click',e=>{ if(holdFired){ holdFired=false; e.preventDefault(); e.stopImmediatePropagation(); } },true);
document.addEventListener('click', e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act, k=el.dataset.k;
  if(!['open','fav','close'].includes(a)) tick();
  if(a!=='open'&&a!=='walkopen'&&el.tagName!=='A') e.preventDefault();
  if(a==='fav'){ e.stopPropagation(); const o=offerOf(k); if(!o) return; toggleFav(o); buzz();
    if($id('sheet').querySelector('.pd')) { openProduct(o); render(); return; }
    syncHearts(o,true); if(route.name==='saved') setTimeout(render,450); return; }
  switch(a){
    case 'go': closeSheet(); go(el.dataset.to); break;
    case 'open': { // single tap opens, double tap favorites
      const o=offerOf(k); if(!o) break;
      if(tapT && tapK===k){ clearTimeout(tapT); tapT=null;
        if(!isFav(o)){ toggleFav(o); } buzz(); burst(el); syncHearts(o,true); break; }
      clearTimeout(tapT); tapK=k; tapT=setTimeout(()=>{tapT=null; openProduct(o)},260); break; }
    case 'add': { const o=offerOf(k); if(o){ addToCart(o); openProduct(o); buzz(); } break; }
    case 'cart': productFromCart=false; openCart(); break;
    case 'cartopen': { const o=offerOf(k); if(o) openProduct(o,true); break; }
    case 'pq': { const c=S.cart.find(x=>x.url===k); if(!c) break; const d=+el.dataset.d;
      if(c.qty+d<1){ undoToast(`Removed ${c.name||c.title}`); S.cart=S.cart.filter(x=>x!==c); } else c.qty+=d;
      save('cart'); $id('cartCount').textContent=S.cart.reduce((a,x)=>a+x.qty,0); openProduct(offerOf(k)); render(); buzz(); const sp=document.querySelector('.bigstep span'); if(sp) sp.classList.add('bump'); break; }
    case 'multi': go('list',{id:'temp'}); setTimeout(()=>{const t=$id('pastetext'); if(t&&!S.temp.items.length) t.focus()},0); break;
    case 'savetemp': { const name=prompt('Name this list', 'My deck'); if(name==null) break; const l={id:uid(),name:name.trim()||'My deck',items:S.temp.items.map(i=>({...i})),at:Date.now()}; S.lists.push(l); S.temp.items=[]; save('lists'); toast('Saved to your lists'); go('list',{id:l.id}); break; }
    case 'cleartemp': S.temp.items=[]; save('lists'); render(); break;
    case 'clearhist': S.searches=[]; save('searches'); render(); break;
    case 'theme': S.theme=S.theme==='light'?'dark':'light'; save('theme'); applyTheme(); render(); tick(); toast(S.theme==='light'?'Light mode':'Dark mode'); break;
    case 'close': dismissSheet(); break;
    case 'q': closeSheet(); doSearch(el.dataset.q); break;
    case 'clearq': searchQ=''; go('home'); setTimeout(()=>$id('q')&&$id('q').focus(),0); break;
    case 'pref': { const p=el.dataset.p; if(p==='sort') S.prefs.sort=S.prefs.sort==='low'?'high':'low'; else S.prefs[p]=!S.prefs[p]; save('prefs'); render(); bounce(document.querySelector(`.fchips [data-p="${p}"]`)); break; }
    case 'store': { const s=el.dataset.s, off=S.prefs.off; S.prefs.off=off.includes(s)?off.filter(x=>x!==s):[...off,s]; save('prefs'); render(); break; }
    case 'list': closeSheet(); go('list',{id:el.dataset.id}); break;
    case 'newlist': newList(el.dataset.n); break;
    case 'tolist': { const l=S.lists.find(x=>x.id===el.dataset.id), n=el.dataset.n; const ex=l.items.find(i=>i.name.toLowerCase()===n.toLowerCase()); if(ex) ex.qty++; else l.items.push({name:n,qty:1}); save('lists'); closeSheet(); render(); toast(`Added to ${l.name}`); break; }
    case 'wishname': chooseList(el.dataset.n); break;
    case 'additem': addItem($id('addcard').value); break;
    case 'paste': $id('pastebox').classList.toggle('hidden'); $id('pasteactions').classList.toggle('hidden'); $id('pastetext').focus(); break;
    case 'importpaste': { const l=curList(); const items=parseList($id('pastetext').value); for(const it of items){const ex=l.items.find(i=>i.name.toLowerCase()===it.name.toLowerCase()); if(ex) ex.qty+=it.qty; else l.items.push(it);} save('lists'); render(); toast(`Added ${items.length} card${items.length===1?'':'s'}`); if(l===S.temp) fetchMany(items.map(i=>i.name).filter(n=>!DATA[n.toLowerCase()])); break; }
    case 'liq': { const l=curList(), it=l.items[+el.dataset.i]; it.qty+=+el.dataset.d; if(it.qty<1) l.items.splice(+el.dataset.i,1); save('lists'); render(); break; }
    case 'findall': { const l=curList(); fetchMany(l.items.map(i=>i.name).filter(n=>!DATA[n.toLowerCase()])); break; }
    case 'dellist': { const l=curList(); if(confirm(`Delete "${l.name}"?`)){ S.lists=S.lists.filter(x=>x!==l); if(!S.lists.length) S.lists=[{id:'wish',name:'Wishlist',items:[],at:Date.now()}]; save('lists'); go('lists'); } break; }
    case 'cq': { const c=S.cart.find(x=>x.url===k); const removing=c.qty+(+el.dataset.d)<1; if(removing) undoToast(`Removed ${c.name||c.title}`);
      c.qty+=+el.dataset.d; if(c.qty<1) S.cart=S.cart.filter(x=>x!==c); save('cart'); openCart(); render(); break; }
    case 'later': { const c=S.cart.find(x=>x.url===k); undoToast('Moved to favorites'); S.cart=S.cart.filter(x=>x!==c); if(!isFav(c)){const {qty,...o}=c; S.favs=[o,...S.favs]; save('favs');} save('cart'); openCart(); render(); break; }
    case 'undo': { const f=undoFn; if(!f) break; f(); undoFn=null; $id('toast').classList.add('hidden'); const pd=$id('sheet').querySelector('.pd [data-act="fav"]'); if($id('sheet').querySelector('.cartsheet')) openCart(); else if(pd){ const o=offerOf(pd.dataset.k); if(o) openProduct(o); } $id('cartCount').textContent=S.cart.reduce((a,x)=>a+x.qty,0); render(); buzz(); break; }
    case 'checkout': { const st=SBY[el.dataset.s], its=S.cart.filter(c=>c.store===st.id);
      if(!st.deck){ const first=its.findIndex(c=>!c.added); walk={store:st.id, i:first<0?0:first}; openWalk(); break; }
      if(st.deck){ const m=new Map(); for(const c of its){const n=c.name||c.title; m.set(n,(m.get(n)||0)+c.qty)} openUrls([deckUrl(st,[...m].map(([name,qty])=>({name,qty})))]); }
      else openUrls(its.map(c=>c.url)); break; }
    case 'bought': { const st=SBY[el.dataset.s]; const gone=S.cart.filter(c=>c.store===st.id); if(!confirm(`Clear ${gone.length} item${gone.length===1?'':'s'} from ${st.name}? Do this once you've paid on their site.`)) break;
      undoToast(`${st.name} cleared`); S.cart=S.cart.filter(c=>c.store!==st.id); save('cart'); walk=null; openCart(); render(); break; }
    case 'walkopen': { const c=walkItems()[walk.i]; c.opened=true; save('cart'); setTimeout(openWalk,300); break; }
    case 'walknext': { const c=walkItems()[walk.i]; c.added=true; save('cart'); walk.i++; openWalk(); break; }
    case 'walkskip': walk.i++; openWalk(); break;
    case 'walkback': walk.i=Math.max(0,walk.i-1); openWalk(); break;
    case 'sync': openSync(); break;
    case 'fold': { const sc=el.closest('.sc'); setFold(sc,!sc.classList.contains('folded')); saveFold(); buzz(); break; }
    case 'csel': { const id=el.dataset.s; if(!id) CSEL.clear(); else if(CSEL.has(id)) CSEL.delete(id); else CSEL.add(id); buzz(); openCart();
      const b=$id('sheet').querySelector('.body'), c=b&&b.querySelector('.cjump'); if(b&&c&&b.scrollTop>c.offsetTop) b.scrollTo({top:c.offsetTop-8,behavior:'smooth'}); break; }
    case 'storeinfo': openStore(SBY[el.dataset.s]); break;
    case 'filt': openFilter(el.dataset.sec, el.dataset.m||'search'); break;
    case 'fq': { FM=el.dataset.m||'search'; const f=fstate(FM), p=el.dataset.p; f.p[p]=!f.p[p]; f.save(); refilter(`[data-act="fq"][data-p="${p}"]`); break; }
    case 'fstore': { FM=el.dataset.m||'search'; const f=fstate(FM), id=el.dataset.s, off=f.p.off; f.p.off=off.includes(id)?off.filter(x=>x!==id):[...off,id]; if(f.stores.every(s=>f.p.off.includes(s.id))){ f.p.off=off; toast('Keep at least one store'); break; } f.save(); refilter(`[data-act="fstore"][data-s="${CSS.escape(id)}"]`); break; }
    case 'fsort': { FM=el.dataset.m||'search'; const f=fstate(FM); f.p.sort=el.dataset.v; f.save(); refilter(`[data-act="fsort"][data-v="${el.dataset.v}"]`); break; }
    case 'fclear': { FM=el.dataset.m||'search'; const f=fstate(FM); f.p.inStock=false; f.p.foil=false; f.p.sort=f.def; f.p.off=[]; f.pr.lo=f.pr.hi=null; f.save(); refilter('#fdone'); buzz(); break; }
    case 'retrysearch': { delete DATA[searchQ.toLowerCase()]; tick(); fetchCard(searchQ); break; }
    case 'bkind': { const st=SBY[el.dataset.s]; BKIND[st.id]=el.dataset.q; tick(); render(); break; }
    case 'seeviewed': go('viewed'); break;
    case 'clearviewed': if(confirm('Clear your recently viewed cards?')){ S.viewed=[]; save('viewed'); render(); } break;
    case 'storeshare': { const st=SBY[el.dataset.s], u=storeHome(st); if(navigator.share) navigator.share({title:st.name,url:u}).catch(()=>{}); else (navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast('Store link copied'),()=>prompt('Store link',u)); break; }
    case 'storetoggle': { const id=el.dataset.s, off=S.prefs.off; S.prefs.off=off.includes(id)?off.filter(x=>x!==id):[...off,id]; save('prefs'); openStore(SBY[id]); render(); break; }
    case 'addstore': openAddStore(); break;
    case 'gostore': { const id=el.dataset.s; if(!SBY[id]) break; productFromCart=false; closeSheet(); if(!(route.name==='store'&&route.id===id)){ storeBack=route.name==='store'?storeBack:{...route,q:searchQ}; storeQ=''; go('store',{id}); } buzz(); break; }
    case 'back': { const b=storeBack||{name:'home'}; storeBack=null; storeQ=''; if(b.name==='search'&&b.q) searchQ=b.q; go(b.name,b); break; }
    case 'sq': { const i=$id('sq'); if(i) i.value=el.dataset.q; storeSearch(SBY[route.id],el.dataset.q); break; }
    case 'sqclear': storeQ=''; render(); setTimeout(()=>$id('sq')&&$id('sq').focus(),0); break;
    case 'addtab': el.dataset.t==='near'?openNearby():openAddStore(); break;
    case 'nearme': locateMe(false); break;
    case 'nearsearch': nearSearch(); break;
    case 'nearadd': nearAdd(+el.dataset.i, el); break;
    case 'savename': { const st=SBY[el.dataset.s], v=$id('storename').value.trim(); if(!v) break; const m=S.myStores.find(x=>'x:'+x.host===st.id); m.name=v; save('myStores'); rebuildStores(); openStore(SBY[st.id]); render(); toast('Name saved'); break; }
    case 'deckedit': { const bx=$id('deckbox'); const open=bx.classList.toggle('hidden'); el.setAttribute('aria-expanded',String(!open)); el.classList.toggle('open',!open); if(!open){ bounce(bx); setTimeout(()=>{ const i=$id('decklink'); if(i){ i.focus(); i.scrollIntoView({block:'center',behavior:'smooth'}); } },120); } break; }
    case 'addredit': { const bx=$id('addrbox'); const open=bx.classList.toggle('hidden'); el.setAttribute('aria-expanded',String(!open)); el.classList.toggle('open',!open); if(!open){ bounce(bx); setTimeout(()=>{ const i=$id('addrin'); if(i){ i.focus(); i.scrollIntoView({block:'center',behavior:'smooth'}); } },120); } break; }
    case 'addrclear': { const st=SBY[el.dataset.s]; S.addrOv={...S.addrOv}; delete S.addrOv[st.id]; save('addrOv'); tick(); toast('Using the address from their website'); openStore(st); if(nearMap) nearRefresh(); break; }
    case 'saveaddr': { const st=SBY[el.dataset.s]; const q=$id('addrin').value.trim(); if(q.length<6){ toast('Type the street address and city'); break; }
      el.disabled=true; el.textContent='…';
      (async()=>{ try{ const j=await (await fetch(`${API}/geo?q=${encodeURIComponent(q)}`)).json();
        if(!j.ok){ toast(j.error||"Couldn't find that address"); el.disabled=false; el.textContent='Save'; return; }
        S.addrOv={...S.addrOv,[st.id]:{address:q,lat:j.lat,lon:j.lon}}; save('addrOv'); tick(); toast('Location saved'); openStore(st); if(nearMap) nearRefresh();
      }catch(e){ toast("Couldn't reach Card Hunt's helper. Try again"); el.disabled=false; el.textContent='Save'; } })();
      break; }
    case 'deckclear': $id('decklink').value=''; /* falls through */
    case 'savedeck': { const st=SBY[el.dataset.s]; const v=$id('decklink').value.trim(); let u=null;
      if(v){ try{ u=new URL(/^https?:/i.test(v)?v:'https://'+v); }catch(e){} if(!u||!/^\/pages\//.test(u.pathname)){ toast('Paste the link to a page on the store, like …/pages/deck-list'); break; } u=u.origin+u.pathname; }
      if(st.custom){ const m=S.myStores.find(x=>'x:'+x.host===st.id); m.deck=u; save('myStores'); }
      else { const b=BUILTIN.find(x=>x.id===st.id); S.deckOv={...S.deckOv}; if((u||undefined)===(b.deck||undefined)) delete S.deckOv[st.id]; else S.deckOv[st.id]=u||''; save('deckOv'); }
      rebuildStores(); openStore(SBY[st.id]); render(); buzz(); toast(u?'Saved. Your cart can go there in one tap':'Deck list link removed. Checkout goes one card at a time'); break; }
    case 'storeadd': addStore($id('storeurl').value); break;
    case 'removestore': { const st=SBY[el.dataset.s]; if(!confirm(`Remove ${st.name} from your stores?`)) break; S.myStores=S.myStores.filter(m=>'x:'+m.host!==st.id); save('myStores'); rebuildStores(); for(const k in DATA) delete DATA[k]; closeSheet(); render(); toast(`Removed ${st.name}`); break; }
    case 'syncon': turnOnSync(); break;
    case 'synclink': linkCode($id('synccode').value); break;
    case 'synccopy': { const u=syncLink(SY.code); (navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast('Link copied'),()=>prompt('Copy this link',u)); break; }
    case 'syncshare': navigator.share({title:'Card Hunt sync',url:syncLink(SY.code)}).catch(()=>{}); break;
    case 'syncnow': syncNow().then(()=>toast(syncState==='ok'?'Synced':"Couldn't sync")); break;
    case 'syncoff': if(confirm('Turn off sync on this device? Your saved cards stay here, and your other devices keep their copy.')){ SY=null; LS.set('sync',null); closeSheet(); render(); toast('Sync is off on this device'); } break;
    case 'install': if(installEvt){ installEvt.prompt(); installEvt.userChoice.finally(()=>{installEvt=null; render();}); } break;
    case 'senddeck': { const st=SBY[el.dataset.s]; openUrls([deckUrl(st, curList().items)]); break; }
  }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&$id('sheet').innerHTML) dismissSheet(); });

// ---------- boot ----------
(function boot(){
  applyTheme();
  const h=decodeURIComponent(location.hash.slice(1));
  if(h.startsWith('sync/')){ const c=cleanCode(h.slice(5)); history.replaceState(null,'',location.pathname); route={name:'home'}; render();
    if(SY&&SY.code===c) toast('This device is already synced');
    else if(confirm(SY?'Switch this device to the other sync code? What you saved here is kept and added to it.':'Sync this device? What you saved here is kept and added to your other devices.')) linkCode(c);
    return; }
  if(h.startsWith('list/')) route={name:'list',id:h.slice(5)};
  else if(h.startsWith('store/')&&SBY[h.slice(6)]) route={name:'store',id:h.slice(6)};
  else if(h.startsWith('search/')){ searchQ=h.slice(7); route={name:'search'}; fetchCard(searchQ); }
  else if(['saved','lists','viewed'].includes(h)) route={name:h};
  render();
})();
if(SY) syncNow();
// Stores added before names and logos were looked up get checked again once, in the background.
(async()=>{ let changed=false;
  for(const m of S.myStores.filter(x=>!x.v)){ try{ const j=await (await fetch(`${API}/store?url=${encodeURIComponent(m.host)}`)).json();
      if(j.ok){ if(j.name&&(!m.name||m.name.includes('.'))) m.name=j.name; if(j.logo) m.logo=j.logo; if(j.deck&&!m.deck) m.deck=j.deck; m.v=2; changed=true; } }catch(e){} }
  if(changed){ save('myStores'); rebuildStores(); render(); } })();
document.addEventListener('visibilitychange',()=>{ if(!SY) return; if(document.visibilityState==='visible') syncNow();
  else if(SY.dirty){ clearTimeout(syncT); SY.dirty=false; saveSY(); cloudPut(SY.code,snapshot(),true).then(at=>{SY.at=at;saveSY()},()=>{SY.dirty=true;saveSY()}); } });
setInterval(()=>{ if(SY&&document.visibilityState==='visible') syncNow(); }, 60000);
</script>
