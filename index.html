<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f6f8">
<script>try{var t=JSON.parse(localStorage.getItem('cardhunt2.theme')||'"auto"');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<title>Card Hunt</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Card Hunt">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Search five Canadian MTG stores at once, save favorites, wishlists and decks.">
<style>
:root{
  --bg:#f6f6f8; --surface:#ffffff; --surface-2:#efeff2; --surface-3:#e4e4e9; --text:#121214; --muted:#6c6c75;
  --line:#e6e6eb; --accent:#5433eb; --accent-text:#fff; --ok:#15803d; --warn:#b45309; --heart:#e11d48;
  --sheet:#18181b; --sheet-2:#26262b; --sheet-text:#f4f4f5; --sheet-muted:#a1a1aa;
  --shadow:0 8px 28px rgba(0,0,0,.14); --r:24px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c0c0e; --surface:#17171a; --surface-2:#222227; --surface-3:#2d2d33; --text:#f4f4f5; --muted:#a1a1aa;
    --line:#2a2a30; --accent:#7c5cff; --ok:#4ade80; --warn:#fbbf24; --heart:#fb7185; --shadow:0 8px 28px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#0c0c0e; --surface:#17171a; --surface-2:#222227; --surface-3:#2d2d33; --text:#f4f4f5; --muted:#a1a1aa;
  --line:#2a2a30; --accent:#7c5cff; --ok:#4ade80; --warn:#fbbf24; --heart:#fb7185; --shadow:0 8px 28px rgba(0,0,0,.5);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
svg{display:block}
.app{max-width:760px;margin:0 auto;padding:12px 16px calc(104px + env(safe-area-inset-bottom))}
.lrail .lcard{flex:none;width:170px}
.hidden{display:none!important}

/* search pill */
.top{position:sticky;top:0;z-index:15;background:var(--bg);padding:8px 0 6px;margin:0 -16px;padding-left:16px;padding-right:16px;display:flex;gap:10px;align-items:center}
.top .pill{flex:1;min-width:0}

.pill{display:flex;align-items:center;gap:10px;background:var(--surface-2);border-radius:999px;padding:0 14px;height:52px;position:relative}
.pill input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font:inherit;font-size:18px}
.pill input::-webkit-search-cancel-button,.pill input::-webkit-search-decoration{-webkit-appearance:none;display:none}
.pill .x{width:26px;height:26px;border-radius:50%;background:var(--surface-3);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.suggest{position:absolute;left:0;right:0;top:58px;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;z-index:20}
.suggest button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 16px}
.suggest button.on,.suggest button:hover{background:var(--surface-2)}
.suggest .muted{color:var(--muted)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;height:42px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:0 16px;font-size:15px;font-weight:500}
.chip.icon{width:50px;justify-content:center;padding:0}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.chip.off{opacity:.45;text-decoration:line-through}

/* headings */
.h{display:flex;align-items:center;gap:8px;margin:22px 0 12px}
.h h2{margin:0;font-size:24px;letter-spacing:-.02em}
.h .more{width:28px;height:28px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center}
.h .right{margin-left:auto;font-size:15px;color:var(--accent);font-weight:600}
.sub{color:var(--muted);font-size:14px;margin:-6px 0 12px}

/* product grid */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 14px}
@media (min-width:620px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.p{min-width:0}
.p .img{touch-action:manipulation;-webkit-user-select:none;user-select:none;position:relative;display:block;width:100%;aspect-ratio:1/1;border-radius:var(--r);overflow:hidden;background:var(--surface-2)}
.p .img img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
.p .img .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;color:var(--muted);font-size:14px}
.heart{position:absolute;right:10px;bottom:10px;width:44px;height:44px;border-radius:50%;background:rgba(80,80,90,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;color:#fff}
.heart.on{color:var(--heart);background:rgba(255,255,255,.92)}
.heart svg{transition:transform .15s}
.heart:active svg{transform:scale(.85)}
.heart.pop svg{animation:pop .45s cubic-bezier(.2,1.8,.4,1)}
@keyframes pop{0%{transform:scale(.5)}55%{transform:scale(1.35)}100%{transform:scale(1)}}
.burst{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;color:#fff;z-index:2}
.burst svg{width:46%;height:auto;filter:drop-shadow(0 6px 18px rgba(0,0,0,.35));animation:burst .9s ease-out forwards}
.burst.off{color:rgba(255,255,255,.9)}
@keyframes burst{0%{transform:scale(.2);opacity:0}15%{transform:scale(1.2);opacity:1}30%{transform:scale(.92)}45%{transform:scale(1.04)}75%{transform:scale(1);opacity:1}100%{transform:scale(1.15) translateY(-12px);opacity:0}}
@media (prefers-reduced-motion: reduce){.heart.pop svg,.burst svg{animation:none}.burst{display:none}}
.tag{position:absolute;left:10px;bottom:10px;background:var(--ok);color:#fff;border-radius:999px;padding:3px 9px;font-weight:600;font-size:12px}
.tag.sold{background:rgba(20,20,24,.7)}
.p .meta{padding:8px 2px 0}
.p .store{color:var(--muted);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p .title{font-weight:650;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p .price{font-weight:700;font-size:17px;margin-top:2px}
.p.out .img{opacity:.55}

/* horizontal rail */
.rail{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 4px}
.rail::-webkit-scrollbar{display:none}
.rail .p{flex:none;width:132px}
.rail .p .img{border-radius:14px;aspect-ratio:488/680}
.rail .p .img img{object-fit:cover;object-position:center}
.rail .heart{width:38px;height:38px;right:8px;bottom:8px}

/* rows */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:14px;padding:10px 0;text-align:left;width:100%}
.row .ic{width:60px;height:60px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;flex:none;color:var(--muted);overflow:hidden}
.row .ic.sq{border-radius:14px}
.row .ic img{width:100%;height:100%;object-fit:cover;object-position:top}
.row .t{font-size:17px;font-weight:550}
.row .s{font-size:15px;color:var(--muted)}
.row .grow{flex:1;min-width:0}
.row .grow .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* cards (lists) */
.lcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.lcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:8px}
.lcard .stack{display:flex;height:70px}
.lcard .stack img,.lcard .stack .blank{width:50px;height:70px;border-radius:8px;object-fit:cover;object-position:top;margin-right:-18px;border:2px solid var(--surface);background:var(--surface-2)}
.lcard .n{font-weight:650}
.lcard .c{font-size:14px;color:var(--muted)}
.newcard{align-items:center;justify-content:center;color:var(--accent);font-weight:600;border-style:dashed;min-height:132px}

/* segmented */

/* list detail */
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.li img,.li .blank{width:46px;height:64px;border-radius:7px;object-fit:cover;object-position:top;background:var(--surface-2);flex:none}
.li .grow{flex:1;min-width:0}
.li .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .b{font-size:14px;color:var(--ok);font-weight:600}
.li .b.none{color:var(--warn)}
.li .b.wait{color:var(--muted);font-weight:400}
.stepper{display:flex;align-items:center;gap:2px;background:var(--surface-2);border-radius:999px;height:36px;padding:0 4px}
.stepper button{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.stepper span{min-width:18px;text-align:center;font-weight:600}
.field{display:flex;gap:8px;margin:12px 0;position:relative}
.field input,.field textarea{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--surface);color:var(--text);border-radius:14px;padding:12px 14px;font:inherit;outline:0}
.field textarea{min-height:130px;resize:vertical}
.field .suggest{top:52px}
.btn{height:48px;border-radius:999px;padding:0 20px;background:var(--accent);color:var(--accent-text);font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:8px}
a.btn{text-decoration:none}
.btn.ghost{background:var(--surface-2);color:var(--text);font-weight:550}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.titleedit{font-size:26px;font-weight:700;letter-spacing:-.02em;border:0;background:transparent;color:var(--text);outline:0;width:100%;padding:0;margin:6px 0 2px}
.total{display:flex;justify-content:space-between;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-top:16px;font-weight:650}
.empty{color:var(--muted);text-align:center;padding:30px 16px}
.skel{aspect-ratio:1/1;border-radius:var(--r);background:var(--surface-2);animation:pulse 1.2s ease-in-out infinite}
.skel.t{aspect-ratio:auto;height:14px;border-radius:7px;margin-top:10px;width:70%}
@keyframes pulse{50%{opacity:.45}}
.note{color:var(--muted);font-size:13px;margin-top:18px}
.h .hint{margin-left:auto;color:var(--muted);font-size:14px}
.srail{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 6px}
.srail::-webkit-scrollbar{display:none}
.sbub{flex:none;width:72px;display:flex;flex-direction:column;align-items:center;gap:6px}
.sbub .logo,.sthead .logo{position:relative;width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:24px;color:#fff}
.sbub .logo.add{background:var(--surface-2);color:var(--accent);border:1.5px dashed var(--line)}
.sbub .logo i{position:absolute;right:-2px;bottom:-2px;width:22px;height:22px;border-radius:50%;background:var(--ok);color:#fff;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg)}
.sbub .nm{font-size:12.5px;line-height:1.2;text-align:center;color:var(--text);max-width:72px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sbub.off .logo{filter:grayscale(1);opacity:.45}
.sbub.off .nm{color:var(--muted);text-decoration:line-through}
.sthead{display:flex;align-items:center;gap:14px;margin:6px 0 10px}
.sthead h2{margin:0;font-size:22px}
.switch{flex:none;width:50px;height:30px;border-radius:999px;background:var(--surface-3);position:relative;transition:background .2s}
.switch i{position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.switch.on{background:var(--ok)}
.switch.on i{transform:translateX(20px)}
.hello{display:flex;align-items:center;gap:8px;padding:14px 0 2px}
.hello>div{flex:1;min-width:0}
.hello h1{margin:0;font-size:30px;letter-spacing:-.03em;line-height:1.1}
.hello p{margin:2px 0 0;color:var(--muted);font-size:15px}
.iconbtn{position:relative;width:44px;height:44px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--text);flex:none}
.iconbtn.on{color:var(--accent)}
.iconbtn i{position:absolute;top:9px;right:9px;width:9px;height:9px;border-radius:50%;background:var(--ok);border:2px solid var(--surface-2)}
.recent{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:4px -16px 0;padding:6px 16px 2px}
.recent::-webkit-scrollbar{display:none}
.recent .chip{height:38px;font-size:14px;padding:0 14px}
.recent .chip.clear{padding:0;width:38px;justify-content:center;color:var(--muted)}
.promo{display:flex;align-items:center;gap:14px;width:100%;text-align:left;margin-top:18px;padding:16px;border-radius:22px;background:var(--accent);color:var(--accent-text)}
.promo .ic{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;flex:none}
.promo .ic svg{width:24px;height:24px}
.promo .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.promo b{font-size:17px}
.promo .grow span{font-size:14px;opacity:.85}
.promo.soft{background:var(--surface);color:var(--text);border:1.5px solid var(--line)}
.promo.soft .ic{background:var(--surface-2);color:var(--accent)}
.promo.soft .grow span{color:var(--muted);opacity:1}
.row>svg{color:var(--muted);flex:none}
.syncs .code{font:700 20px/1.3 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.04em;background:var(--surface-2);border-radius:16px;padding:16px;text-align:center;margin:10px 0 4px;word-break:break-all;user-select:all}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.links a{font-size:13px;text-decoration:none;background:var(--surface-2);border-radius:999px;padding:6px 11px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;gap:10px;padding:10px 16px calc(14px + env(safe-area-inset-bottom));pointer-events:none}
.navpill{pointer-events:auto;display:flex;align-items:center;gap:4px;background:var(--surface);border-radius:999px;padding:6px;box-shadow:var(--shadow)}
.navpill button{width:58px;height:54px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.navpill button.on{background:var(--surface-2);color:var(--text)}
.cartbtn{pointer-events:auto;width:66px;height:66px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);position:relative}
.cartbtn span{position:absolute;top:14px;right:12px;font-size:12px;font-weight:800;background:#fff;color:var(--accent);border-radius:999px;padding:0 5px;min-width:18px;text-align:center}

/* sheets */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet .scrim{position:absolute;inset:0;background:rgba(0,0,0,.5);animation:fadein .28s ease-out}
.sheet .body{animation:slideup .38s cubic-bezier(.22,1,.36,1);transition:transform .25s cubic-bezier(.22,1,.36,1);will-change:transform}
.sheet.closing{pointer-events:none}
.sheet.closing .scrim{animation:fadeout .22s ease-in forwards}
.sheet.closing .body{animation:slidedown .22s ease-in forwards}
@keyframes fadein{from{opacity:0}}
@keyframes fadeout{to{opacity:0}}
@keyframes slideup{from{transform:translateY(100%)}}
@keyframes slidedown{to{transform:translateY(100%)}}
@media (prefers-reduced-motion: reduce){.sheet .scrim,.sheet .body{animation:none}}
.sheet .body{position:relative;width:100%;max-width:760px;max-height:92vh;overflow-y:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:14px 16px calc(28px + env(safe-area-inset-bottom))}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--surface-3);margin:0 auto 12px}
.sheet .close{position:absolute;right:14px;top:14px;width:38px;height:38px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center}
.pd .big{width:100%;max-width:360px;margin:6px auto 0;display:block;border-radius:18px;aspect-ratio:488/680;object-fit:cover;background:var(--surface-2)}
.pd .store{color:var(--muted);margin-top:14px}
.pd h3{margin:2px 0 4px;font-size:22px;letter-spacing:-.01em}
.pd .pr{font-size:22px;font-weight:750}
.pd .st{font-size:14px;font-weight:600;color:var(--ok);margin-top:2px}
.pd .st.sold{color:var(--warn)}
.pd .hint{color:var(--muted);font-size:14px;margin-top:8px}

/* cart (dark, like Shop) */
.cartsheet .body{background:#0b0b0d;color:var(--sheet-text)}
.cartsheet .grab{background:#333}
.cartsheet .close{background:var(--sheet-2);color:var(--sheet-text)}
.cartsheet h2{margin:4px 0 14px;font-size:24px}
.sc{background:var(--sheet);border-radius:28px;padding:18px;margin-bottom:14px}
.sc .shd{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.sc .logo{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;flex:none}
.sc .sn{font-size:18px;font-weight:650}
.ci{display:flex;gap:14px;padding:10px 0}
.ci img,.ci .blank{width:92px;height:128px;border-radius:12px;object-fit:cover;object-position:top;background:var(--sheet-2);flex:none}
.ci .grow{flex:1;min-width:0}
.ci .top2{display:flex;gap:8px;justify-content:space-between}
.ci .nm{font-size:16px;font-weight:650;line-height:1.25}
.ci .pp{font-weight:650;white-space:nowrap}
.ci .cd{color:var(--sheet-muted);font-size:15px;margin-top:4px}
.ci .ctl{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.ci .stepper{background:var(--sheet-2);height:40px}
.ci .stepper button{color:var(--sheet-text)}
.ci .later{height:40px;padding:0 14px;border-radius:999px;background:var(--sheet-2);font-size:14px;font-weight:600}
.sc .subt{display:flex;justify-content:space-between;font-size:17px;margin:12px 0}
.sc .co{display:block;width:100%;height:54px;border-radius:999px;background:var(--sheet-2);color:var(--sheet-text);font-weight:650;font-size:17px}
.sc .info{display:flex;align-items:center;gap:10px;color:var(--sheet-muted);font-size:14px;margin-top:12px}
.ci .added{color:#4ade80;font-size:14px;font-weight:600;margin-top:4px}
.grandrow{display:flex;justify-content:space-between;font-size:18px;font-weight:700;padding:6px 6px 4px}
.walk .shd{display:flex;align-items:center;gap:12px;margin:4px 0 14px}
.walk .logo{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;flex:none}
.cartsheet .btn.ghost{background:var(--sheet-2);color:var(--sheet-text)}
.walk .sn{font-size:18px;font-weight:650}
.walk .cd{color:var(--sheet-muted);font-size:15px}
.walk .bar{height:6px;border-radius:3px;background:var(--sheet-2);overflow:hidden;margin-bottom:16px}
.walk .bar span{display:block;height:100%;background:var(--accent);transition:width .3s}
.walk .wi{display:flex;gap:14px;align-items:center;background:var(--sheet);border-radius:22px;padding:14px}
.walk .wi img{width:96px;height:134px;border-radius:12px;object-fit:cover;object-position:top;flex:none}
.walk .nm{font-size:17px;font-weight:650;line-height:1.25}
.walk .qtyneed{margin-top:8px;font-size:15px}
.walk .steps{color:var(--sheet-muted);font-size:15px;line-height:1.6;padding-left:22px;margin:16px 0}
.walk .steps b{color:var(--sheet-text)}
.walk .later{height:40px;padding:0 14px;border-radius:999px;background:var(--sheet-2);font-size:14px;font-weight:600;margin-top:12px}
.walk.done{text-align:center;padding:20px 0}
.walk.done .big{font-size:56px}
.walk.done .sub{color:var(--sheet-muted)}
.coall{position:sticky;bottom:0;display:flex;gap:10px;padding-top:10px}
.coall .btn{flex:1;height:56px;font-size:17px}
.cartsheet .empty{color:var(--sheet-muted)}
.cartsheet .note{color:var(--sheet-muted)}

.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:60;box-shadow:var(--shadow);transition:opacity .2s;max-width:calc(100% - 32px);text-align:center;display:flex;align-items:center;gap:14px;white-space:nowrap}
.toast span{overflow:hidden;text-overflow:ellipsis}
body:has(#sheet .cartsheet) .toast{background:#fff;color:#121214}
body:has(#sheet .cartsheet) .toast button{color:#5433eb;filter:none}
.toast button{color:var(--accent);font-weight:750;font-size:15px;padding:4px 2px;flex:none;filter:brightness(1.35)}
</style>

<body>
<div class="app" id="app"></div>

<nav class="nav">
  <div class="navpill">
    <button data-act="go" data-to="home" id="nav-home" title="Home"></button>
    <button data-act="go" data-to="saved" id="nav-saved" title="Favorites"></button>
    <button data-act="go" data-to="lists" id="nav-lists" title="Lists and decks"></button>
  </div>
  <button class="cartbtn" data-act="cart" title="Cart"><span id="cartCount">0</span></button>
</nav>
<div id="sheet"></div>
<div id="toast" class="toast hidden"></div>

<script>
// ---------- config ----------
const API = 'https://card-hunt.areasmina.workers.dev';
const BUILTIN = [
  {id:'ea',     name:'EA Collectibles', color:'#0f766e', host:'www.eacollectibles.com', url:q=>`https://www.eacollectibles.com/search?q=${enc(q)}&options%5Bprefix%5D=last`},
  {id:'lamood', name:'La Mood',         color:'#be185d', host:'lamoodcomics.ca', url:q=>`https://lamoodcomics.ca/search?q=${enc('*'+q+'*')}`},
  {id:'mana',   name:'Mana Lounge',     color:'#1d4ed8', host:'www.manalounge.ca', url:q=>`https://www.manalounge.ca/search?q=${enc(q)}&options%5Bprefix%5D=last`, deck:'https://www.manalounge.ca/pages/deck-list'},
  {id:'ge',     name:'Gamers Emporium', color:'#b45309', host:'gamersemporium.ca', url:q=>`https://gamersemporium.ca/search?q=${enc(q)}&options%5Bprefix%5D=last`},
  {id:'players',name:'Players',         color:'#6b7280', host:'playerscandc.com', url:q=>`https://playerscandc.com/search?page=1&q=${enc('*'+q+'*')}`, deck:'https://playerscandc.com/pages/multi-card-search'},
];
// Stores the person adds themselves (any Shopify store). They sync like favorites and lists.
const PALETTE=['#7c3aed','#0891b2','#c2410c','#15803d','#db2777','#4f46e5','#a16207','#0f766e'];
let STORES=[], SBY={};
function rebuildStores(){
  const mine=(S.myStores||[]).map((m,i)=>({id:'x:'+m.host, name:m.name, host:m.host, deck:m.deck||undefined, custom:true, color:PALETTE[i%PALETTE.length],
    url:q=>`https://${m.host}/search?q=${enc(q)}`}));
  STORES=[...BUILTIN,...mine]; SBY=Object.fromEntries(STORES.map(s=>[s.id,s]));
}
// Mana Lounge and Players have a deck-list page that adds cards straight to their own cart.
function deckUrl(store, items){ return store.deck + '?game=mtg&' + items.map(i=>'cards='+encodeURIComponent(`${i.qty} ${i.name}`)).join('&'); }
function enc(s){return encodeURIComponent(s).replace(/%20/g,'+')}

// ---------- icons ----------
const I = {
  search:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  home:'<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M10.6 3.5a2.2 2.2 0 0 1 2.8 0l6.4 5.3c.5.4.8 1 .8 1.7v8.3a2.2 2.2 0 0 1-2.2 2.2h-3.2v-5.2a1.2 1.2 0 0 0-1.2-1.2h-4a1.2 1.2 0 0 0-1.2 1.2V21H5.6a2.2 2.2 0 0 1-2.2-2.2v-8.3c0-.7.3-1.3.8-1.7z"/></svg>',
  heart:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M12 20.5s-7.5-4.6-9.2-9.4C1.6 7.6 3.9 4.5 7.2 4.5c2 0 3.5 1.1 4.8 2.8 1.3-1.7 2.8-2.8 4.8-2.8 3.3 0 5.6 3.1 4.4 6.6-1.7 4.8-9.2 9.4-9.2 9.4z"/></svg>',
  heartFill:'<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 20.5s-7.5-4.6-9.2-9.4C1.6 7.6 3.9 4.5 7.2 4.5c2 0 3.5 1.1 4.8 2.8 1.3-1.7 2.8-2.8 4.8-2.8 3.3 0 5.6 3.1 4.4 6.6-1.7 4.8-9.2 9.4-9.2 9.4z"/></svg>',
  grid:'<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="8" height="8" rx="2.2"/><rect x="13" y="3" width="8" height="8" rx="2.2"/><rect x="3" y="13" width="8" height="8" rx="2.2"/><rect x="13" y="13" width="8" height="8" rx="2.2"/></svg>',
  cart:'<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 3.5h2.2l2.4 11.2a1.8 1.8 0 0 0 1.8 1.4h8.6a1.8 1.8 0 0 0 1.7-1.3l1.6-6.3H6"/><circle cx="9.5" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/></svg>',
  x:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  chev:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>',
  down:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>',
  filter:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg>',
  chat:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="14" rx="5"/><path d="M8 10h8M8 14h5"/></svg>',
  trash:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13"/></svg>',
  plus:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  minus:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 12h14"/></svg>',
  ship:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="3"/><path d="M8 7V5.5a1.5 1.5 0 0 1 1.5-1.5h5A1.5 1.5 0 0 1 16 5.5V7"/></svg>',
  cloud:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18.5h10.5a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.4 9.1 4.7 4.7 0 0 0 7 18.5z"/><path d="m9.5 13.5 2 2 3.5-3.5"/></svg>',
  phone:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="6.5" y="2.5" width="11" height="19" rx="3"/><path d="M12 7v7m-3-3 3 3 3-3"/></svg>',
  ext:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/></svg>',
};
$id('nav-home').innerHTML=I.home; $id('nav-saved').innerHTML=I.heart; $id('nav-lists').innerHTML=I.grid;
document.querySelector('.cartbtn').insertAdjacentHTML('afterbegin', I.cart);

// ---------- theme ----------
const SUN='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>';
const MOON='<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5a8.5 8.5 0 1 0 11.1 11.1z"/></svg>';
const AUTO='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg>';
function themeIcon(){return S.theme==='light'?SUN:S.theme==='dark'?MOON:AUTO}
function applyTheme(){
  const r=document.documentElement;
  if(S.theme==='auto') delete r.dataset.theme; else r.dataset.theme=S.theme;
  const dark=S.theme==='dark'||(S.theme==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);
  document.querySelector('meta[name="theme-color"]').content=dark?'#0c0c0e':'#f6f6f8';
}
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>applyTheme());

// ---------- utils ----------
function $id(i){return document.getElementById(i)}
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '$' + (Number(n)||0).toFixed(2);
const priceText = o => (o.priceMax > o.price + 0.001) ? `${money(o.price)}–${money(o.priceMax)}` : money(o.price);
const scry = name => `https://api.scryfall.com/cards/named?fuzzy=${encodeURIComponent(name)}&format=image&version=normal`;
const uid = () => Math.random().toString(36).slice(2,9);
function ago(t){const m=Math.round((Date.now()-t)/60000);if(m<1)return'Just now';if(m<60)return m+' min ago';const h=Math.round(m/60);if(h<24)return h+(h>1?' hours ago':' hour ago');return new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric'})}
const LS = {
  get(k,d){try{const v=localStorage.getItem('cardhunt2.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('cardhunt2.'+k,JSON.stringify(v))}catch(e){}}
};
let toastT, undoFn=null; function toast(msg){const t=$id('toast');undoFn=null;t.textContent=msg;t.classList.remove('hidden');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.add('hidden'),1800)}
// A toast with an Undo button. It stays up for 6 seconds; undo puts the cart and favorites back as they were.
function undoToast(msg){ const before=JSON.stringify({cart:S.cart,favs:S.favs}); const t=$id('toast');
  t.innerHTML=`<span>${esc(msg)}</span><button data-act="undo">Undo</button>`; t.classList.remove('hidden'); clearTimeout(toastT);
  undoFn=()=>{ const b=JSON.parse(before); S.cart=b.cart; S.favs=b.favs; save('cart'); save('favs'); };
  toastT=setTimeout(()=>{t.classList.add('hidden'); undoFn=null},6000); return before; }

// ---------- state ----------
const S = {
  favs: LS.get('favs', []),            // offers
  cart: LS.get('cart', []),            // offers + qty
  viewed: LS.get('viewed', []),        // offers
  searches: LS.get('searches', []),    // {q, at}
  lists: LS.get('lists', null),        // {id,name,items:[{name,qty}],at}
  prefs: LS.get('prefs', {off:[], inStock:true, foil:false, sort:'low'}),
  theme: LS.get('theme', 'auto'),
  temp: LS.get('temp', {id:'temp', name:'Card list', items:[]}),   // the quick multi-card search
  myStores: LS.get('myStores', []),   // {host, name, deck}
};
rebuildStores();
if(!S.lists){
  // carry over the list from the first version, if any
  let old=''; try{old=JSON.parse(localStorage.getItem('cardhunt.list')||'""')}catch(e){}
  S.lists=[{id:'wish',name:'Wishlist',items:parseList(old||''),at:Date.now()}];
  LS.set('lists',S.lists);
}
const save = k => { LS.set(k, S[k]); if(k==='lists') LS.set('temp', S.temp); if(SYNCED.includes(k)) markDirty(); };
// ---------- sync across devices ----------
// Each person gets a secret sync code. Every device that has the code shares the same favorites, lists and cart.
const SYNCED=['favs','cart','viewed','searches','lists','temp','myStores'];
let SY=LS.get('sync',null);            // {code, at (last server version we have), dirty}
let syncState='idle', syncT=null, syncBusy=false;
const ALPH='abcdefghjkmnpqrstuvwxyz23456789';
const newCode=()=>[...crypto.getRandomValues(new Uint8Array(20))].map(b=>ALPH[b%ALPH.length]).join('');
const cleanCode=c=>String(c||'').toLowerCase().replace(/[^a-z0-9]/g,'');
const prettyCode=c=>c.match(/.{1,4}/g).join('-');
const syncLink=c=>`${location.origin}${location.pathname}#sync/${c}`;
const snapshot=()=>Object.fromEntries(SYNCED.map(k=>[k,S[k]]));
const saveSY=()=>LS.set('sync',SY);
function markDirty(){ if(!SY) return; SY.dirty=true; saveSY(); clearTimeout(syncT); syncT=setTimeout(syncNow,3000); }
function unionBy(a,b,key,pick){ const m=new Map(); for(const x of [...(a||[]),...(b||[])]){ const k=key(x); m.set(k, m.has(k)?(pick?pick(m.get(k),x):m.get(k)):x); } return [...m.values()]; }
function mergeItems(a,b){ return unionBy(a,b,i=>i.name.toLowerCase(),(x,y)=>({...x,qty:Math.max(x.qty,y.qty)})); }
function mergeData(a,b){ // a = this device, b = the cloud; nothing is lost from either side
  return {
    favs: unionBy(a.favs,b.favs,o=>o.url),
    cart: unionBy(a.cart,b.cart,o=>o.url,(x,y)=>({...x,qty:Math.max(x.qty,y.qty),added:x.added||y.added})),
    viewed: unionBy(a.viewed,b.viewed,o=>o.url).slice(0,30),
    searches: unionBy(a.searches,b.searches,x=>x.q.toLowerCase(),(x,y)=>x.at>y.at?x:y).sort((x,y)=>y.at-x.at).slice(0,20),
    lists: unionBy(a.lists,b.lists,l=>l.id,(x,y)=>({...((x.at||0)>=(y.at||0)?x:y),items:mergeItems(x.items,y.items)})),
    myStores: unionBy(a.myStores,b.myStores,x=>x.host),
    temp: {...(a.temp||b.temp||{id:'temp',name:'Card list'}), items:mergeItems(a.temp&&a.temp.items,b.temp&&b.temp.items)},
  };
}
function applyData(d){
  for(const k of SYNCED) if(d[k]!=null){ S[k]=d[k]; LS.set(k,S[k]); }
  rebuildStores();
  if(!Array.isArray(S.lists)||!S.lists.length){ S.lists=[{id:'wish',name:'Wishlist',items:[],at:Date.now()}]; LS.set('lists',S.lists); }
}
async function cloudGet(code){ const r=await fetch(`${API}/sync/${code}`,{cache:'no-store'}); if(r.status===404) return null; if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }
async function cloudPut(code,data,keepalive){ const at=Date.now(); const r=await fetch(`${API}/sync/${code}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({at,data}),keepalive:!!keepalive}); if(!r.ok) throw new Error('HTTP '+r.status); return at; }
function setSyncState(st){ syncState=st; const el=$id('syncstatus'); if(el) el.textContent=syncLabel(); }
function syncLabel(){
  if(!SY) return 'Off. Turn on to see your cards on every device';
  if(syncState==='busy') return 'Syncing…';
  if(syncState==='err') return "Couldn't sync, will retry";
  return SY.at?`On, synced ${ago(SY.at).toLowerCase()}`:'On';
}
// Pull the cloud copy; if this device also changed, merge both; then push if anything is new here.
async function syncNow(){
  if(!SY) return; if(syncBusy){ clearTimeout(syncT); syncT=setTimeout(syncNow,2000); return; } syncBusy=true; clearTimeout(syncT); setSyncState('busy');
  try{
    const remote=await cloudGet(SY.code); let changed=false;
    if(remote && remote.at>(SY.at||0)){
      applyData(SY.dirty?mergeData(snapshot(),remote.data):remote.data); SY.at=remote.at; changed=true;
      if(!SY.dirty) saveSY();
    }
    if(SY.dirty||!remote){ SY.dirty=false; saveSY(); try{ SY.at=await cloudPut(SY.code,snapshot()); }catch(e){ SY.dirty=true; throw e; } }
    saveSY(); setSyncState('ok');
    if(changed){ render(); if($id('sheet').querySelector('.cartsheet')) openCart(); }
  }catch(e){ setSyncState('err'); clearTimeout(syncT); syncT=setTimeout(syncNow,30000); }
  finally{ syncBusy=false; }
}
async function turnOnSync(){
  SY={code:newCode(),at:0,dirty:true}; saveSY(); await syncNow();
  if(syncState==='err'){ SY=null; LS.set('sync',null); toast("Couldn't reach the sync service. Try again"); } else toast('Sync is on');
  openSync();
}
async function linkCode(raw){
  const code=cleanCode(raw); if(code.length<16){ toast("That doesn't look like a sync code"); return; }
  setSyncState('busy');
  let remote; try{ remote=await cloudGet(code); }catch(e){ setSyncState('err'); toast("Couldn't reach the sync service. Try again"); return; }
  if(!remote){ setSyncState('idle'); toast("We couldn't find that sync code"); return; }
  applyData(mergeData(snapshot(),remote.data)); SY={code,at:remote.at,dirty:true}; saveSY();
  await syncNow(); render(); toast('This device is synced'); openSync();
}
function openStore(st){
  const on=!S.prefs.off.includes(st.id);
  sheet(`<div class="grab"></div><button class="close" data-act="close">${I.x}</button><div class="syncs">
    <div class="sthead"><span class="logo" style="background:${st.color}">${esc(st.name[0])}</span><div><h2>${esc(st.name)}</h2><div class="sub" style="margin:0">${esc(st.host)}</div></div></div>
    <button class="row" data-act="storetoggle" data-s="${esc(st.id)}"><span class="grow"><div class="t">Include in searches</div><div class="s">${on?'Card Hunt checks this store every time you search':'Skipped when you search'}</div></span><span class="switch${on?' on':''}"><i></i></span></button>
    <div class="row" style="cursor:default"><span class="grow"><div class="t">Checking out</div><div class="s">${st.deck?'Has a deck list page, so Card Hunt can send your whole cart there in one tap':'No deck list page, so Card Hunt walks you through adding each card'}</div></span></div>
    <div class="actions" style="margin-top:14px"><a class="btn" href="${esc(storeHome(st))}" target="_blank" rel="noopener">Visit store ${I.ext}</a>${st.custom?`<button class="btn ghost" data-act="removestore" data-s="${esc(st.id)}" style="color:var(--heart)">${I.trash} Remove</button>`:''}</div></div>`);
}
function openAddStore(msg=''){
  sheet(`<div class="grab"></div><button class="close" data-act="close">${I.x}</button><div class="syncs">
    <div class="h" style="margin-top:4px"><h2>Add a store</h2></div>
    <p class="sub">Paste the store's website. Card Hunt checks that it can search it and whether it has a deck list page for sending your cart.</p>
    <div class="field"><input id="storeurl" placeholder="e.g. www.yourlocalstore.ca" inputmode="url" autocapitalize="off" autocomplete="off" spellcheck="false"><button class="btn" data-act="storeadd">Add</button></div>
    <p class="sub" id="storemsg" style="margin-top:4px">${msg}</p>
    <p class="note">Works with stores built on Shopify, which most Canadian card shops use.</p></div>`);
  setTimeout(()=>$id('storeurl')&&$id('storeurl').focus(),350);
}
async function addStore(raw){
  const m=$id('storemsg'), b=document.querySelector('[data-act="storeadd"]'); if(!raw.trim()) return;
  m.textContent='Checking the store…'; b.disabled=true;
  try{
    const r=await fetch(`${API}/store?url=${encodeURIComponent(raw.trim())}`); const j=await r.json();
    if(!j.ok){ m.textContent=j.error||"Couldn't add that store."; b.disabled=false; return; }
    if(STORES.some(x=>x.host===j.host)){ m.textContent=`${j.name} is already one of your stores.`; b.disabled=false; return; }
    S.myStores=[...S.myStores,{host:j.host,name:j.name,deck:j.deck||null}]; save('myStores'); rebuildStores();
    for(const k in DATA) delete DATA[k];
    closeSheet(); render(); toast(j.deck?`Added ${j.name}. It has a deck list page`:`Added ${j.name}`);
  }catch(e){ m.textContent="Couldn't reach Card Hunt's helper. Try again."; b.disabled=false; }
}
function openSync(){
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  if(!SY){ sheet(`<div class="grab"></div><button class="close" data-act="close">${I.x}</button><div class="syncs">
    <div class="h" style="margin-top:4px"><h2>Sync across devices</h2></div>
    <p class="sub">Right now your favorites, lists and cart are saved in this browser only. Turn on sync to see them on your phone, computer and any browser.</p>
    <button class="btn block" data-act="syncon">${I.cloud.replace('width="26" height="26"','width="20" height="20"')} Turn on sync</button>
    <div class="sub" style="margin:22px 0 4px">Already turned it on somewhere else? Enter that sync code:</div>
    <div class="field"><input id="synccode" placeholder="xxxx-xxxx-xxxx-xxxx-xxxx" autocapitalize="off" autocomplete="off" spellcheck="false"><button class="btn" data-act="synclink">Link</button></div>
    <p class="note">No account or password. Your sync code is the key, so only share it with your own devices.</p></div>`); return; }
  sheet(`<div class="grab"></div><button class="close" data-act="close">${I.x}</button><div class="syncs">
    <div class="h" style="margin-top:4px"><h2>Sync across devices</h2></div>

// ---------- parsing ----------
function parseLine(line){
  let s=line.trim();
  if(!s||/^(\/\/|#)/.test(s)||/^(deck|sideboard|commander|companion|maybeboard)\s*:?$/i.test(s))return null;
  let qty=1; const m=s.match(/^(\d+)\s*x?\s+(.*)$/i); if(m){qty=+m[1];s=m[2]}
  s=s.replace(/\s*\*[^*]*\*\s*/g,' ').replace(/\s*\([A-Za-z0-9]{2,6}\)\s*[\w★-]*\s*$/,'').replace(/\s*\[[^\]]*\]\s*$/,'').replace(/\s+#\S+$/,'').trim();
  return s?{qty,name:s}:null;
}
function parseList(text){
  const map=new Map();
  for(const l of String(text).split('\n')){const p=parseLine(l);if(!p)continue;const k=p.name.toLowerCase();
    if(map.has(k))map.get(k).qty+=p.qty;else map.set(k,p)}
  return [...map.values()];
}

// ---------- data ----------
async function fetchCard(name){
  const k=name.toLowerCase();
  if(DATA[k]?.state==='ok' && Date.now()-DATA[k].at<10*60e3) return DATA[k];
  DATA[k]={state:'loading',offers:[]}; render();
  try{
    const extra=S.myStores.map(m=>m.host).join(',');
    const r=await fetch(`${API}/search?q=${encodeURIComponent(name)}${extra?'&extra='+encodeURIComponent(extra):''}`);
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j=await r.json();
    const offers=(j.results||[]).map(p=>remember({store:p.store, storeName:p.storeName, title:p.title, name:p.name||name, set:p.set, url:p.url,
      image:p.image, foil:!!p.foil, price:p.priceMin??0, priceMax:p.priceMax??p.priceMin??0, available:!!p.available}));
    DATA[k]={state:'ok',offers,errors:j.errors||[],at:Date.now()};
  }catch(e){ DATA[k]={state:'err',offers:[],error:String(e.message||e)}; }
  render(); return DATA[k];
}
async function fetchMany(names){
  const q=[...names]; let active=0;
  await new Promise(res=>{const next=()=>{ if(!q.length&&!active) return res();
    while(active<3&&q.length){active++; fetchCard(q.shift()).finally(()=>{active--;next()})} }; next();});
}
function filtered(offers){
  const p=S.prefs; let o=offers.filter(x=>!p.off.includes(x.store));
  if(p.inStock) o=o.filter(x=>x.available);
  if(p.foil) o=o.filter(x=>x.foil);
  o.sort((a,b)=>(b.available-a.available)||(p.sort==='low'?a.price-b.price:b.price-a.price));
  return o;
}
function best(name){
  const d=DATA[name.toLowerCase()]; if(!d||d.state!=='ok') return null;
  const o=d.offers.filter(x=>x.available&&!S.prefs.off.includes(x.store));
  return o.length? o.reduce((a,b)=>b.price<a.price?b:a) : false;
}

// ---------- search + autocomplete ----------
function doSearch(q){
  q=q.trim(); if(q.length<2) return;
  searchQ=q; S.searches=[{q,at:Date.now()},...S.searches.filter(s=>s.q.toLowerCase()!==q.toLowerCase())].slice(0,12); save('searches');
  go('search',{q}); fetchCard(q);
}
function autocomplete(input, box, onPick){
  let items=[], idx=-1, t, req=0;
  const hide=()=>{box.classList.add('hidden');items=[];idx=-1};
  const show=()=>{ if(!items.length) return hide();
    box.innerHTML=items.map((n,i)=>`<button type="button" class="${i===idx?'on':''}" data-n="${esc(n)}"><span class="muted">${I.search}</span>${esc(n)}</button>`).join('');
    box.classList.remove('hidden');
    box.querySelectorAll('button').forEach(b=>b.onmousedown=e=>{e.preventDefault();hide();onPick(b.dataset.n)}); };
  input.addEventListener('input',()=>{ clearTimeout(t); const q=input.value.trim(); if(q.length<2) return hide();
    t=setTimeout(async()=>{const id=++req; try{const r=await fetch('https://api.scryfall.com/cards/autocomplete?q='+encodeURIComponent(q));const j=await r.json();
      if(id!==req)return; items=(j.data||[]).slice(0,7); idx=-1; show()}catch(e){hide()}},150)});
  input.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'&&items.length){e.preventDefault();idx=(idx+1)%items.length;show()}
    else if(e.key==='ArrowUp'&&items.length){e.preventDefault();idx=(idx-1+items.length)%items.length;show()}
    else if(e.key==='Enter'){e.preventDefault();const v=idx>=0?items[idx]:input.value;hide();onPick(v)}
    else if(e.key==='Escape')hide();});
  input.addEventListener('blur',()=>setTimeout(hide,120));
}
function wireInputs(){
  const q=$id('q');
  if(q){
    autocomplete(q,$id('sug'),v=>{q.value=v;doSearch(v)});
    q.addEventListener('input',()=>q.parentElement.querySelector('.x').classList.toggle('hidden',!q.value));
  }
  const fq=$id('favq');
  if(fq) fq.addEventListener('input',()=>{ favF.q=fq.value; $id('favgrid').innerHTML=favGrid(); });
  const add=$id('addcard');
  if(add) autocomplete(add,$id('sug2'),v=>{addItem(v)});
  const ln=$id('lname');
  if(ln) ln.addEventListener('change',()=>{const l=curList(); l.name=ln.value.trim()||'Untitled list'; save('lists')});
}

let tapT=null, tapK=null;
function toggleFav(o){
  if(isFav(o)){S.favs=S.favs.filter(f=>f.url!==o.url); toast('Removed from favorites')}
  else {S.favs=[{...o},...S.favs]; toast('Saved to favorites')}
  save('favs');
}
function addToCart(o,q=1){const c=inCart(o); if(c) c.qty+=q; else S.cart.push({...o,qty:q}); save('cart'); $id('cartCount').textContent=S.cart.reduce((a,c)=>a+c.qty,0); toast('Added to cart')}
function viewed(o){S.viewed=[o,...S.viewed.filter(v=>v.url!==o.url)].slice(0,20); save('viewed')}

function openProduct(o){
  viewed(o);
  const c=inCart(o);
  sheet(`<div class="pd"><div class="grab"></div><button class="close" data-act="close">${I.x}</button>
    ${imgTag(o,'big')}
    <div class="store">${esc(o.storeName)}</div><h3>${esc(o.title)}</h3>
    <div class="pr">${esc(priceText(o))}</div>
    <div class="st${o.available?'':' sold'}">${o.available?'In stock':'Sold out'}${o.foil?' · Foil':''}</div>
    <div class="hint">${o.priceMax>o.price+0.001?'Price depends on condition. You choose the condition on the store\'s page.':'Check the condition on the store\'s page.'}</div>
    <div class="actions" style="margin-top:16px">
      ${o.available?`<button class="btn" data-act="add" data-k="${esc(o.url)}">${I.cart.replace('width="30" height="30"','width="20" height="20"')} ${c?`In cart (${c.qty}) · add another`:'Add to cart'}</button>`:''}
      <button class="btn ghost" data-act="fav" data-k="${esc(o.url)}">${isFav(o)?I.heartFill:I.heart} ${isFav(o)?'Saved':'Favorite'}</button>
      <a class="btn ghost" href="${esc(o.url)}" target="_blank" rel="noopener" style="text-decoration:none">${I.ext} View at store</a>
    </div>
    <div class="actions">
      <button class="btn ghost" data-act="wishname" data-n="${esc(o.name||o.title)}">${I.plus} Add to a list</button>
      ${route.name==='search'&&searchQ.toLowerCase()===(o.name||'').toLowerCase()?'':`<button class="btn ghost" data-act="q" data-q="${esc(o.name||o.title)}">${I.search} Compare all stores</button>`}
    </div>
  </div>`);
}
function chooseList(name){
  sheet(`<div class="grab"></div><button class="close" data-act="close">${I.x}</button>
    <div class="h" style="margin-top:4px"><h2>Add to a list</h2></div><div class="sub">"${esc(name)}"</div>
    <div class="rows">${S.lists.map(l=>`<button class="row" data-act="tolist" data-id="${l.id}" data-n="${esc(name)}"><span class="ic sq">${l.items[0]?`<img alt="" src="${esc(scry(l.items[0].name))}">`:I.grid}</span><span class="grow"><div class="t">${esc(l.name)}</div><div class="s">${countCards(l)} card${countCards(l)===1?'':'s'}</div></span></button>`).join('')}
    <button class="row" data-act="newlist" data-n="${esc(name)}"><span class="ic">${I.plus}</span><span class="grow"><div class="t">New list</div></span></button></div>`);
}
function storeLogo(s){return `<span class="logo" style="background:${s.color}">${esc(s.name[0])}</span>`}
function openCart(){
  const groups=STORES.map(s=>({s,items:S.cart.filter(c=>c.store===s.id)})).filter(g=>g.items.length);
  const grand=S.cart.reduce((a,c)=>a+c.price*c.qty,0);
  sheet(`<div class="grab"></div><button class="close" data-act="close">${I.x}</button><h2>Cart</h2>
    ${groups.length?groups.map(({s,items})=>{const sub=items.reduce((a,c)=>a+c.price*c.qty,0); return `<div class="sc">
      <div class="shd">${storeLogo(s)}<div class="sn">${esc(s.name)}</div></div>
      ${items.map(c=>`<div class="ci">${imgTag(c)}<div class="grow"><div class="top2"><div class="nm">${esc(c.title)}</div><div class="pp">${esc(money(c.price*c.qty))}</div></div>
        <div class="cd">${c.foil?'Foil · ':''}${esc(priceText(c))} each</div>${c.added?'<div class="added">✓ Added at the store</div>':''}
        <div class="ctl"><div class="stepper"><button data-act="cq" data-k="${esc(c.url)}" data-d="-1">${c.qty>1?I.minus:I.trash}</button><span>${c.qty}</span><button data-act="cq" data-k="${esc(c.url)}" data-d="1">${I.plus}</button></div>
        <button class="later" data-act="later" data-k="${esc(c.url)}">Save for later</button></div></div></div>`).join('')}
      <div class="subt"><span>Subtotal from</span><span>${money(sub)}</span></div>
      <button class="co" data-act="checkout" data-s="${s.id}">${s.deck?`Send to ${esc(s.name)}${s.name.endsWith('s')?"'":"'s"} cart`:`Add to ${esc(s.name)}${s.name.endsWith('s')?"'":"'s"} cart, one by one`}</button>
      <div class="info">${I.cart.replace('width="30" height="30"','width="22" height="22"')} ${s.deck?'Opens the store\'s deck list with these cards. Tap "Submit decklist", pick conditions, and they go into the store\'s cart.':'Card Hunt opens each card on the store\'s site, one at a time. Add it to their cart, come back, and tap Next.'}</div>
      <div class="info">${I.ship} Each store ships and checks out separately.</div>
      <button class="later" style="margin-top:12px" data-act="bought" data-s="${s.id}">✓ I bought these, clear them</button></div>`}).join('')
      +`<div class="grandrow"><span>Total from, all stores</span><span>${money(grand)}</span></div>`
    :`<div class="empty">Your cart is empty.<br>Tap a card, then "Add to cart".</div>`}`, 'cartsheet');
}
// ---------- guided one-by-one checkout ----------
let walk=null; // {store, i}
function walkItems(){ return S.cart.filter(c=>c.store===walk.store); }
function storeHome(st){ if(st.host) return 'https://'+st.host; const c=S.cart.find(x=>x.store===st.id); try{ return new URL(c.url).origin; }catch(e){ return ''; } }
function openWalk(){
  const st=SBY[walk.store], its=walkItems(), n=its.length;
  if(!n){ walk=null; return openCart(); }
  if(walk.i>=n){
    const home=storeHome(st);
    return sheet(`<div class="grab"></div><button class="close" data-act="close">${I.x}</button>
      <div class="walk done"><div class="big">🎉</div><h2>${its.filter(c=>c.added).length} of ${n} added</h2>${its.some(c=>!c.added)?`<div class="sub">You skipped ${its.filter(c=>!c.added).length}. Tap the cart button again to go back to them.</div>`:""}
      <div class="sub">Your ${esc(st.name)} cart should now have everything. Finish paying on their site.</div>
      ${home?`<a class="btn block" href="${esc(home)}/cart" target="_blank" rel="noopener" style="text-decoration:none">${I.ext} Go to ${esc(st.name)} checkout</a>`:''}
      <button class="btn ghost block" style="margin-top:10px" data-act="bought" data-s="${st.id}">✓ I paid, clear these from Card Hunt</button>
      <button class="btn ghost block" style="margin-top:10px" data-act="cart">Back to my cart</button></div>`,'cartsheet');
  }
  const c=its[walk.i];
  sheet(`<div class="grab"></div><button class="close" data-act="close">${I.x}</button>
    <div class="walk">
      <div class="shd">${storeLogo(st)}<div><div class="sn">${esc(st.name)}</div><div class="cd">Card ${walk.i+1} of ${n}</div></div></div>
      <div class="bar"><span style="width:${Math.round(walk.i/n*100)}%"></span></div>
      <div class="wi">${imgTag(c)}<div><div class="nm">${esc(c.title)}</div><div class="cd">${c.foil?'Foil · ':''}${esc(priceText(c))}</div><div class="qtyneed">Add <b>${c.qty}</b> to the store's cart</div></div></div>
      <ol class="steps"><li>Tap <b>Open at ${esc(st.name)}</b>.</li><li>Pick the condition and tap their <b>Add to cart</b>${c.qty>1?` (quantity ${c.qty})`:''}.</li><li>Come back here and tap <b>Added, next</b>.</li></ol>
      <a class="btn block" href="${esc(c.url)}" target="_blank" rel="noopener" style="text-decoration:none" data-act="walkopen">${I.ext} Open at ${esc(st.name)}</a>
      <div class="actions" style="margin-top:10px">
        <button class="btn ${c.opened?'':'ghost'}" style="flex:2" data-act="walknext">✓ Added, next</button>
        <button class="btn ghost" style="flex:1" data-act="walkskip">Skip</button>
      </div>
      ${walk.i>0?'<button class="later" data-act="walkback">← Previous card</button>':''}
    </div>`,'cartsheet');
}
// Panels slide up when they open and slide down when they close. Updating an open panel (a cart stepper, the
// next card in the walk-through) swaps its content in place, so it doesn't animate again or lose its scroll.
function sheet(html, cls=''){
  const cur=$id('sheet').querySelector('.sheet');
  if(cur){ const same=cur.dataset.cls===cls; const b=cur.querySelector('.body'), top=b.scrollTop;
    cur.className=`sheet ${cls}`; cur.dataset.cls=cls; b.innerHTML=html; if(same) b.scrollTop=top; else b.scrollTop=0; return; }
  $id('sheet').innerHTML=`<div class="sheet ${cls}" data-cls="${cls}"><div class="scrim" data-act="close"></div><div class="body">${html}</div></div>`;
  document.body.style.overflow='hidden'; dragToClose($id('sheet').querySelector('.body'));
}
function closeSheet(){
  const cur=$id('sheet').querySelector('.sheet'); document.body.style.overflow='';
  if(!cur) return; $id('sheet').innerHTML='';
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  cur.classList.add('closing'); document.body.appendChild(cur);
  const b=cur.querySelector('.body'); if(b.style.transform) b.style.transition='transform .22s ease-in';
  setTimeout(()=>cur.remove(),240);
}
// Swipe a panel down from the top to close it, like a native sheet.
function dragToClose(b){
  let y0=null, dy=0;
  b.addEventListener('touchstart',e=>{ y0=b.scrollTop<=0?e.touches[0].clientY:null; dy=0; b.style.transition='none'; },{passive:true});
  b.addEventListener('touchmove',e=>{ if(y0==null) return; dy=Math.max(0,e.touches[0].clientY-y0); if(dy>0) b.style.transform=`translateY(${dy}px)`; },{passive:true});
  b.addEventListener('touchend',()=>{ if(y0==null) return; y0=null; b.style.transition='';
    if(dy>110){ b.style.transform=`translateY(${dy}px)`; closeSheet(); render(); } else b.style.transform=''; });
}
function openUrls(urls){ let blocked=false; for(const u of urls){const w=window.open(u,'_blank','noopener'); if(w===null) blocked=true;} if(blocked&&urls.length>1) toast('Allow pop-ups to open every item'); }
function newList(withName){
  const name=prompt('Name your new list', 'My list'); if(name==null) return;
  const l={id:uid(),name:name.trim()||'Untitled list',items:withName?[{name:withName,qty:1}]:[],at:Date.now()};
  S.lists.push(l); save('lists'); closeSheet(); go('list',{id:l.id});
}

document.addEventListener('click', e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act, k=el.dataset.k;
  if(a!=='open'&&a!=='walkopen'&&el.tagName!=='A') e.preventDefault();
  if(a==='fav'){ e.stopPropagation(); const o=OFFERS[k]; if(!o) return; toggleFav(o); buzz();
    if($id('sheet').querySelector('.pd')) { openProduct(o); render(); return; }
    syncHearts(o,true); if(route.name==='saved') setTimeout(render,450); return; }
  switch(a){
    case 'go': closeSheet(); go(el.dataset.to); break;
    case 'open': { // single tap opens, double tap favorites
      const o=OFFERS[k]; if(!o) break;
      if(tapT && tapK===k){ clearTimeout(tapT); tapT=null;
        if(!isFav(o)){ toggleFav(o); } buzz(); burst(el); syncHearts(o,true); break; }
      clearTimeout(tapT); tapK=k; tapT=setTimeout(()=>{tapT=null; openProduct(o)},260); break; }
    case 'add': { const o=OFFERS[k]; if(o){ addToCart(o); openProduct(o); } break; }
    case 'cart': openCart(); break;
    case 'multi': go('list',{id:'temp'}); setTimeout(()=>{const t=$id('pastetext'); if(t&&!S.temp.items.length) t.focus()},0); break;
    case 'savetemp': { const name=prompt('Name this list', 'My deck'); if(name==null) break; const l={id:uid(),name:name.trim()||'My deck',items:S.temp.items.map(i=>({...i})),at:Date.now()}; S.lists.push(l); S.temp.items=[]; save('lists'); toast('Saved to your lists'); go('list',{id:l.id}); break; }
    case 'cleartemp': S.temp.items=[]; save('lists'); render(); break;
    case 'clearhist': S.searches=[]; save('searches'); render(); break;
    case 'theme': S.theme={auto:'light',light:'dark',dark:'auto'}[S.theme]; save('theme'); applyTheme(); render(); toast(S.theme==='auto'?'Theme follows your device':S.theme==='light'?'Light mode':'Dark mode'); break;
    case 'close': closeSheet(); render(); break;
    case 'q': closeSheet(); doSearch(el.dataset.q); break;
    case 'clearq': searchQ=''; go('home'); setTimeout(()=>$id('q')&&$id('q').focus(),0); break;
    case 'pref': { const p=el.dataset.p; if(p==='sort') S.prefs.sort=S.prefs.sort==='low'?'high':'low'; else S.prefs[p]=!S.prefs[p]; save('prefs'); render(); break; }
    case 'store': { const s=el.dataset.s, off=S.prefs.off; S.prefs.off=off.includes(s)?off.filter(x=>x!==s):[...off,s]; save('prefs'); render(); break; }
    case 'list': closeSheet(); go('list',{id:el.dataset.id}); break;
    case 'newlist': newList(el.dataset.n); break;
    case 'tolist': { const l=S.lists.find(x=>x.id===el.dataset.id), n=el.dataset.n; const ex=l.items.find(i=>i.name.toLowerCase()===n.toLowerCase()); if(ex) ex.qty++; else l.items.push({name:n,qty:1}); save('lists'); closeSheet(); render(); toast(`Added to ${l.name}`); break; }
    case 'wishname': chooseList(el.dataset.n); break;
    case 'additem': addItem($id('addcard').value); break;
    case 'paste': $id('pastebox').classList.toggle('hidden'); $id('pasteactions').classList.toggle('hidden'); $id('pastetext').focus(); break;
    case 'importpaste': { const l=curList(); const items=parseList($id('pastetext').value); for(const it of items){const ex=l.items.find(i=>i.name.toLowerCase()===it.name.toLowerCase()); if(ex) ex.qty+=it.qty; else l.items.push(it);} save('lists'); render(); toast(`Added ${items.length} card${items.length===1?'':'s'}`); if(l===S.temp) fetchMany(items.map(i=>i.name).filter(n=>!DATA[n.toLowerCase()])); break; }
    case 'liq': { const l=curList(), it=l.items[+el.dataset.i]; it.qty+=+el.dataset.d; if(it.qty<1) l.items.splice(+el.dataset.i,1); save('lists'); render(); break; }
    case 'findall': { const l=curList(); fetchMany(l.items.map(i=>i.name).filter(n=>!DATA[n.toLowerCase()])); break; }
    case 'dellist': { const l=curList(); if(confirm(`Delete "${l.name}"?`)){ S.lists=S.lists.filter(x=>x!==l); if(!S.lists.length) S.lists=[{id:'wish',name:'Wishlist',items:[],at:Date.now()}]; save('lists'); go('lists'); } break; }
    case 'cq': { const c=S.cart.find(x=>x.url===k); const removing=c.qty+(+el.dataset.d)<1; if(removing) undoToast(`Removed ${c.name||c.title}`);
      c.qty+=+el.dataset.d; if(c.qty<1) S.cart=S.cart.filter(x=>x!==c); save('cart'); openCart(); render(); break; }
    case 'later': { const c=S.cart.find(x=>x.url===k); undoToast('Moved to favorites'); S.cart=S.cart.filter(x=>x!==c); if(!isFav(c)){const {qty,...o}=c; S.favs=[o,...S.favs]; save('favs');} save('cart'); openCart(); render(); break; }
    case 'undo': { const f=undoFn; if(!f) break; f(); undoFn=null; $id('toast').classList.add('hidden'); if($id('sheet').querySelector('.cartsheet')) openCart(); render(); buzz(); break; }
    case 'checkout': { const st=SBY[el.dataset.s], its=S.cart.filter(c=>c.store===st.id);
      if(!st.deck){ const first=its.findIndex(c=>!c.added); walk={store:st.id, i:first<0?0:first}; openWalk(); break; }
      if(st.deck){ const m=new Map(); for(const c of its){const n=c.name||c.title; m.set(n,(m.get(n)||0)+c.qty)} openUrls([deckUrl(st,[...m].map(([name,qty])=>({name,qty})))]); }
      else openUrls(its.map(c=>c.url)); break; }
    case 'bought': { const st=SBY[el.dataset.s]; const gone=S.cart.filter(c=>c.store===st.id); if(!confirm(`Clear ${gone.length} item${gone.length===1?'':'s'} from ${st.name}? Do this once you've paid on their site.`)) break;
      undoToast(`${st.name} cleared`); S.cart=S.cart.filter(c=>c.store!==st.id); save('cart'); walk=null; openCart(); render(); break; }
    case 'walkopen': { const c=walkItems()[walk.i]; c.opened=true; save('cart'); setTimeout(openWalk,300); break; }
    case 'walknext': { const c=walkItems()[walk.i]; c.added=true; save('cart'); walk.i++; openWalk(); break; }
    case 'walkskip': walk.i++; openWalk(); break;
    case 'walkback': walk.i=Math.max(0,walk.i-1); openWalk(); break;
    case 'sync': openSync(); break;
    case 'storeinfo': openStore(SBY[el.dataset.s]); break;
    case 'storetoggle': { const id=el.dataset.s, off=S.prefs.off; S.prefs.off=off.includes(id)?off.filter(x=>x!==id):[...off,id]; save('prefs'); openStore(SBY[id]); render(); break; }
    case 'addstore': openAddStore(); break;
    case 'storeadd': addStore($id('storeurl').value); break;
    case 'removestore': { const st=SBY[el.dataset.s]; if(!confirm(`Remove ${st.name} from your stores?`)) break; S.myStores=S.myStores.filter(m=>'x:'+m.host!==st.id); save('myStores'); rebuildStores(); for(const k in DATA) delete DATA[k]; closeSheet(); render(); toast(`Removed ${st.name}`); break; }
    case 'favsort': { const k=Object.keys(FAVSORT); favF.sort=k[(k.indexOf(favF.sort)+1)%k.length]; render(); break; }
    case 'favstock': favF.inStock=!favF.inStock; render(); break;
    case 'favstore': favF.store=el.dataset.s; render(); break;
    case 'favreset': favF={q:'',store:'',inStock:false,sort:favF.sort}; render(); break;
    case 'syncon': turnOnSync(); break;
    case 'synclink': linkCode($id('synccode').value); break;
    case 'synccopy': { const u=syncLink(SY.code); (navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast('Link copied'),()=>prompt('Copy this link',u)); break; }
    case 'syncshare': navigator.share({title:'Card Hunt sync',url:syncLink(SY.code)}).catch(()=>{}); break;
    case 'syncnow': syncNow().then(()=>toast(syncState==='ok'?'Synced':"Couldn't sync")); break;
    case 'syncoff': if(confirm('Turn off sync on this device? Your saved cards stay here, and your other devices keep their copy.')){ SY=null; LS.set('sync',null); closeSheet(); render(); toast('Sync is off on this device'); } break;
    case 'install': if(installEvt){ installEvt.prompt(); installEvt.userChoice.finally(()=>{installEvt=null; render();}); } break;
    case 'senddeck': { const st=SBY[el.dataset.s]; openUrls([deckUrl(st, curList().items)]); break; }
  }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&$id('sheet').innerHTML) closeSheet(); });

// ---------- boot ----------
(function boot(){
  applyTheme();
  const h=decodeURIComponent(location.hash.slice(1));
  if(h.startsWith('sync/')){ const c=cleanCode(h.slice(5)); history.replaceState(null,'',location.pathname); route={name:'home'}; render();
    if(SY&&SY.code===c) toast('This device is already synced');
    else if(confirm(SY?'Switch this device to the other sync code? What you saved here is kept and added to it.':'Sync this device? What you saved here is kept and added to your other devices.')) linkCode(c);
    return; }
  if(h.startsWith('list/')) route={name:'list',id:h.slice(5)};
  else if(h.startsWith('search/')){ searchQ=h.slice(7); route={name:'search'}; fetchCard(searchQ); }
  else if(['saved','lists'].includes(h)) route={name:h};
  render();
})();
if(SY) syncNow();
document.addEventListener('visibilitychange',()=>{ if(!SY) return; if(document.visibilityState==='visible') syncNow();
  else if(SY.dirty){ clearTimeout(syncT); SY.dirty=false; saveSY(); cloudPut(SY.code,snapshot(),true).then(at=>{SY.at=at;saveSY()},()=>{SY.dirty=true;saveSY()}); } });
setInterval(()=>{ if(SY&&document.visibilityState==='visible') syncNow(); }, 60000);
</script>
