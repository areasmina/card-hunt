<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Card Hunt</title>
<meta name="description" content="Search five Canadian MTG stores at once for singles and sealed product.">
<style>
:root{
  --bg:#f6f6f8; --surface:#ffffff; --surface-2:#efeff3; --text:#16161a; --muted:#6b6b76;
  --line:#e2e2e8; --accent:#5a31f4; --accent-text:#ffffff; --ok:#1f8a4c; --warn:#b4560f; --radius:18px;
  --shadow:0 10px 30px rgba(0,0,0,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e0e11; --surface:#1a1a1f; --surface-2:#25252c; --text:#f2f2f5; --muted:#9d9daa;
    --line:#2f2f38; --accent:#7b5cff; --accent-text:#ffffff; --ok:#4cc27e; --warn:#f0a35e; --shadow:0 10px 30px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#0e0e11; --surface:#1a1a1f; --surface-2:#25252c; --text:#f2f2f5; --muted:#9d9daa;
  --line:#2f2f38; --accent:#7b5cff; --accent-text:#ffffff; --ok:#4cc27e; --warn:#f0a35e; --shadow:0 10px 30px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:16px 16px 110px}
header{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
header h1{font-size:22px;margin:0;letter-spacing:-.01em}
header .tag{color:var(--muted);font-size:14px}
.search{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px}
.search textarea{width:100%;min-height:84px;resize:vertical;border:0;outline:0;background:transparent;color:var(--text);font:inherit}
.search .hint{color:var(--muted);font-size:13px;margin-top:4px}
.go{display:flex;gap:8px;margin-top:10px}
.btn{border:0;border-radius:12px;padding:10px 16px;background:var(--accent);color:var(--accent-text);font-weight:600;cursor:pointer}
.btn.ghost{background:var(--surface-2);color:var(--text);font-weight:500}
.btn:disabled{opacity:.5;cursor:default}
.suggest{position:absolute;left:12px;right:12px;z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;display:none}
.suggest button{display:block;width:100%;text-align:left;padding:10px 12px;border:0;background:transparent;cursor:pointer}
.suggest button.on,.suggest button:hover{background:var(--surface-2)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px;cursor:pointer}
.chip.off{opacity:.45;text-decoration:line-through}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.status{color:var(--muted);font-size:14px;margin:12px 2px 0;min-height:20px}
.cardsec{margin-top:22px}
.cardhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 2px 10px}
.cardhead h2{font-size:18px;margin:0;overflow-wrap:anywhere}
.cardhead .best{font-size:13px;color:var(--ok);font-weight:600}
.cardhead .none{font-size:13px;color:var(--warn);font-weight:600}
.cardhead .qty{font-size:13px;color:var(--muted)}
.cardhead .links{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.cardhead .links a,.cardhead .links button{font-size:12.5px;text-decoration:none;color:var(--text);background:var(--surface-2);border:0;border-radius:999px;padding:5px 10px;cursor:pointer}
.cardhead .tick{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.cardsec.done{opacity:.55}
.cardsec.done .tick{background:var(--ok);color:#fff;border-color:var(--ok)}
.cardsec.done h2{text-decoration:line-through}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:900px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column}
.tile.out{opacity:.5}
.art{position:relative;aspect-ratio:488/680;background:var(--surface-2);display:block}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.price{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.65);color:#fff;border-radius:999px;padding:3px 10px;font-weight:700;font-size:14px}
.cheapest{position:absolute;right:8px;top:8px;background:var(--ok);color:#fff;border-radius:999px;padding:3px 8px;font-weight:600;font-size:11.5px}
.tbody{padding:9px 11px 11px;display:flex;flex-direction:column;gap:3px;flex:1}
.tstore{color:var(--muted);font-size:13px}
.ttitle{font-weight:600;font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tcond{font-size:13px;color:var(--muted)}
.add{margin-top:auto;border:0;border-radius:10px;padding:8px;background:var(--surface-2);font-weight:600;cursor:pointer;margin-top:8px}
.add.in{background:var(--accent);color:var(--accent-text)}
.skel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);aspect-ratio:488/760;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
.empty{color:var(--muted);text-align:center;padding:22px 12px}
.recent{display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:6px}
.recent button{display:flex;justify-content:space-between;gap:10px;text-align:left;border:0;background:transparent;padding:10px;border-radius:12px;cursor:pointer}
.recent button:hover{background:var(--surface-2)}
.recent .when{color:var(--muted);font-size:13px;flex:none}
.sectitle{font-size:18px;margin:28px 2px 10px}
.fab{position:fixed;right:18px;bottom:18px;z-index:30;width:62px;height:62px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-text);box-shadow:var(--shadow);cursor:pointer;font-size:24px}
.fab span{position:absolute;right:-2px;top:-2px;background:var(--text);color:var(--bg);border-radius:999px;font-size:12px;font-weight:700;padding:2px 7px}
.drawer{position:fixed;inset:0;z-index:40;display:none}
.drawer.open{display:block}
.drawer .scrim{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.drawer .panel{position:absolute;right:0;top:0;bottom:0;width:min(440px,100%);background:var(--bg);overflow-y:auto;padding:16px}
.panel h2{margin:0 0 12px;font-size:20px;display:flex;justify-content:space-between;align-items:center}
.panel .x{border:0;background:var(--surface-2);border-radius:50%;width:36px;height:36px;cursor:pointer}
.cstore{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:14px}
.cstore h3{margin:0 0 10px;font-size:16px}
.citem{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.citem img{width:54px;border-radius:6px;flex:none}
.citem .ci{flex:1;min-width:0}
.citem .ct{font-size:14px;font-weight:600}
.citem .cc{font-size:13px;color:var(--muted)}
.citem .row{display:flex;align-items:center;gap:8px;margin-top:4px}
.citem .row button{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;width:28px;height:28px;cursor:pointer}
.citem .cp{font-weight:600;white-space:nowrap}
.subtotal{display:flex;justify-content:space-between;margin:10px 0;font-weight:600}
.checkout{display:block;text-align:center;text-decoration:none;background:var(--text);color:var(--bg);border-radius:12px;padding:11px;font-weight:600}
.grand{display:flex;justify-content:space-between;font-size:17px;font-weight:700;padding:6px 4px 14px}
.note{color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Card Hunt</h1><span class="tag">5 stores, one search</span></header>

  <div class="search">
    <textarea id="list" placeholder="One card or product per line, e.g.&#10;Decaying Time Loop&#10;Whitemane Lion&#10;Bloomburrow collector booster" spellcheck="false" autocomplete="off"></textarea>
    <div class="suggest" id="suggest"></div>
    <div class="hint">Moxfield and ManaBox lists work as-is. Quantities, set codes and foil tags are removed.</div>
    <div class="go"><button class="btn" id="searchBtn">Search stores</button><button class="btn ghost" id="clearAll">Clear</button></div>
  </div>

  <div class="chips" id="storeChips"></div>
  <div class="chips">
    <button class="chip" id="soldOutChip">Show sold out</button>
    <button class="chip" id="foilChip">Foil only</button>
    <button class="chip" id="sortChip">Sort: price low to high</button>
  </div>

  <div class="status" id="status"></div>
  <div id="results"></div>

  <h2 class="sectitle">Recent searches</h2>
  <div class="recent" id="recent"></div>
  <p class="note" style="margin-top:14px">Prices and stock come from each store's website and are cached for up to 10 minutes. Always confirm at checkout.</p>
</div>

<button class="fab" id="fab" title="Cart">🛒<span id="fabCount">0</span></button>
<div class="drawer" id="drawer"><div class="scrim" id="scrim"></div><div class="panel" id="panel"></div></div>

<script>
const API = 'https://card-hunt.areasmina.workers.dev';
const STORES = [
  {id:'ea',     name:'EA Collectibles', host:'www.eacollectibles.com', url:q=>`https://www.eacollectibles.com/search?q=${enc(q)}&options%5Bprefix%5D=last`},
  {id:'lamood', name:'La Mood',         host:'lamoodcomics.ca',        url:q=>`https://lamoodcomics.ca/search?q=${enc('*'+q+'*')}`},
  {id:'mana',   name:'Mana Lounge',     host:'www.manalounge.ca',      url:q=>`https://www.manalounge.ca/search?q=${enc(q)}&options%5Bprefix%5D=last`},
  {id:'ge',     name:'Gamers Emporium', host:'gamersemporium.ca',      url:q=>`https://gamersemporium.ca/search?q=${enc(q)}&options%5Bprefix%5D=last`},
  {id:'players',name:'Players',         host:'playerscandc.com',       url:q=>`https://playerscandc.com/search?page=1&q=${enc('*'+q+'*')}`},
];
const SBY = Object.fromEntries(STORES.map(s=>[s.id,s]));
function enc(s){return encodeURIComponent(s).replace(/%20/g,'+')}
const money = n => '$' + n.toFixed(2);
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e=document.createElement(tag); if(cls)e.className=cls; if(text!=null)e.textContent=text; return e; };

const store = {
  get(k,d){try{const v=localStorage.getItem('cardhunt.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('cardhunt.'+k,JSON.stringify(v))}catch(e){}}
};
let off = new Set(store.get('off',[]));
let done = new Set(store.get('done',[]));
let recent = store.get('recent',[]);
let cart = store.get('cart',[]);   // {store, variantId, title, set, condition, foil, price, image, url, qty}
let showSold = store.get('showSold', false), foilOnly = store.get('foilOnly', false), sortAsc = true;
let data = {};                      // name(lower) -> {state:'loading'|'ok'|'err', offers:[], errors:[]}

const list = $('list');
list.value = store.get('list','');

function parse(line){
  let s=line.trim();
  if(!s||/^(\/\/|#)/.test(s)||/^(deck|sideboard|commander|companion|maybeboard)\s*:?$/i.test(s))return null;
  let qty=1; const m=s.match(/^(\d+)\s*x?\s+(.*)$/i); if(m){qty=+m[1];s=m[2]}
  s=s.replace(/\s*\*[^*]*\*\s*/g,' ').replace(/\s*\([A-Za-z0-9]{2,6}\)\s*[\w★-]*\s*$/,'').replace(/\s*\[[^\]]*\]\s*$/,'').replace(/\s+#\S+$/,'').trim();
  return s?{qty,name:s}:null;
}
function items(){
  const map=new Map();
  for(const l of list.value.split('\n')){const p=parse(l);if(!p)continue;const k=p.name.toLowerCase();
    if(map.has(k))map.get(k).qty+=p.qty;else map.set(k,{...p})}
  return [...map.values()];
}

// ---------- search ----------
async function fetchCard(name){
  const k=name.toLowerCase();
  data[k]={state:'loading',offers:[],errors:[]}; render();
  try{
    const r=await fetch(`${API}/search?q=${encodeURIComponent(name)}`);
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j=await r.json();
    const offers=[];
    for(const p of j.results||[])
      offers.push({store:p.store, storeName:p.storeName, title:p.title, set:p.set, url:p.url, image:p.image,
        foil:p.foil, price:p.priceMin??0, priceMax:p.priceMax??p.priceMin??0, available:p.available});
    data[k]={state:'ok',offers,errors:j.errors||[]};
  }catch(e){ data[k]={state:'err',offers:[],errors:[{error:String(e.message||e)}]}; }
  render();
}
async function runSearch(){
  const its=items(); if(!its.length) return;
  saveRecent(its);
  $('searchBtn').disabled=true;
  const queue=its.map(i=>i.name); let active=0;
  await new Promise(res=>{
    const next=()=>{ if(!queue.length&&!active) return res();
      while(active<3&&queue.length){ active++; fetchCard(queue.shift()).finally(()=>{active--;next()}); } };
    next();
  });
  $('searchBtn').disabled=false;
}

// ---------- render ----------
function visibleOffers(offers){
  let o=offers.filter(x=>!off.has(x.store));
  if(!showSold) o=o.filter(x=>x.available);
  if(foilOnly) o=o.filter(x=>x.foil);
  o.sort((a,b)=>(b.available-a.available)||(sortAsc?a.price-b.price:b.price-a.price));
  return o;
}
function inCart(o){return cart.find(c=>c.url===o.url)}
const priceText = o => (o.priceMax>o.price+0.001) ? `${money(o.price)}–${money(o.priceMax)}` : money(o.price);

function render(){
  const its=items(), R=$('results'); R.innerHTML='';
  const st=$('status');
  if(!its.length){R.appendChild(el('div','empty','Type a card name above, then tap Search stores.'));st.textContent='';return}
  const loading=its.filter(i=>data[i.name.toLowerCase()]?.state==='loading').length;
  st.textContent=loading?`Searching ${loading} of ${its.length}…`:'';
  const activeStores=STORES.filter(s=>!off.has(s.id));
  for(const it of its){
    const k=it.name.toLowerCase(), d=data[k];
    const sec=el('section','cardsec'+(done.has(k)?' done':''));
    const head=el('div','cardhead');
    const tick=el('button','tick','✓'); tick.title='Mark as found';
    tick.onclick=()=>{done.has(k)?done.delete(k):done.add(k);store.set('done',[...done]);render()};
    head.append(tick, el('h2',null,it.name));
    if(it.qty>1) head.appendChild(el('span','qty','need '+it.qty));
    if(d?.state==='ok'){
      const instock=d.offers.filter(x=>x.available&&!off.has(x.store)&&(!foilOnly||x.foil));
      if(instock.length){const b=instock.reduce((a,b)=>b.price<a.price?b:a); head.appendChild(el('span','best',`from ${money(b.price)} at ${b.storeName}`))}
      else head.appendChild(el('span','none','not in stock'));
    }
    const links=el('div','links');
    for(const s of activeStores){const a=el('a',null,s.name);a.href=s.url(it.name);a.target='_blank';a.rel='noopener';links.appendChild(a)}
    head.appendChild(links);
    sec.appendChild(head);

    const g=el('div','grid');
    if(!d){ sec.appendChild(el('div','empty','Tap Search stores to see prices.')); }
    else if(d.state==='loading'){ for(let i=0;i<4;i++) g.appendChild(el('div','skel')); sec.appendChild(g); }
    else if(d.state==='err'){ sec.appendChild(el('div','empty','Could not reach the search helper. Use the store links above, or try again.')); }
    else{
      const vo=visibleOffers(d.offers);
      if(!vo.length) sec.appendChild(el('div','empty', d.offers.length?'Nothing matches your filters. Try "Show sold out".':'No store lists this yet.'));
      const cheapestKey = vo.find(x=>x.available);
      for(const o of vo.slice(0,30)){
        const t=el('div','tile'+(o.available?'':' out'));
        const art=el('a','art'); art.href=o.url; art.target='_blank'; art.rel='noopener';
        if(o.image){const im=el('img');im.loading='lazy';im.alt=o.title;im.src=o.image;art.appendChild(im)}
        art.appendChild(el('span','price',priceText(o)));
        if(o===cheapestKey&&sortAsc) art.appendChild(el('span','cheapest','Cheapest'));
        t.appendChild(art);
        const b=el('div','tbody');
        b.append(el('div','tstore',o.storeName), el('div','ttitle',o.set||o.title), el('div','tcond',`${o.foil?'Foil · ':''}${o.available?'In stock':'Sold out'}`));
        if(o.available){
          const c=inCart(o); const add=el('button','add'+(c?' in':''), c?`In cart (${c.qty})`:'Add to cart');
          add.onclick=()=>addToCart(o); b.appendChild(add);
        }
        t.appendChild(b); g.appendChild(t);
      }
      if(vo.length) sec.appendChild(g);
      for(const e of d.errors||[]) if(e.store) sec.appendChild(el('div','note',`${SBY[e.store]?.name||e.store} didn't respond. Use its link above.`));
    }
    R.appendChild(sec);
  }
}

function renderChips(){
  const c=$('storeChips');c.innerHTML='';
  for(const s of STORES){const b=el('button','chip'+(off.has(s.id)?' off':''),s.name);
    b.onclick=()=>{off.has(s.id)?off.delete(s.id):off.add(s.id);store.set('off',[...off]);renderChips();render()};c.appendChild(b)}
  $('soldOutChip').className='chip'+(showSold?' on':'');
  $('foilChip').className='chip'+(foilOnly?' on':'');
  $('sortChip').textContent='Sort: price '+(sortAsc?'low to high':'high to low');
}
$('soldOutChip').onclick=()=>{showSold=!showSold;store.set('showSold',showSold);renderChips();render()};
$('foilChip').onclick=()=>{foilOnly=!foilOnly;store.set('foilOnly',foilOnly);renderChips();render()};
$('sortChip').onclick=()=>{sortAsc=!sortAsc;renderChips();render()};

// ---------- cart ----------
function saveCart(){store.set('cart',cart);$('fabCount').textContent=cart.reduce((a,c)=>a+c.qty,0)}
function addToCart(o){const c=inCart(o); if(c)c.qty++; else cart.push({store:o.store,title:o.title,set:o.set,foil:o.foil,price:o.price,priceMax:o.priceMax,image:o.image,url:o.url,qty:1});
  saveCart();render();}
function renderCart(){
  const P=$('panel');P.innerHTML='';
  const h=el('h2',null,'Your carts');const x=el('button','x','✕');x.onclick=closeCart;h.appendChild(x);P.appendChild(h);
  if(!cart.length){P.appendChild(el('div','empty','Your cart is empty. Tap "Add to cart" on any card.'));return}
  let grand=0;
  for(const s of STORES){
    const its=cart.filter(c=>c.store===s.id); if(!its.length) continue;
    const box=el('div','cstore'); box.appendChild(el('h3',null,s.name));
    let sub=0;
    for(const c of its){
      sub+=c.price*c.qty;
      const row=el('div','citem');
      if(c.image){const im=el('img');im.src=c.image;im.alt='';row.appendChild(im)}
      const ci=el('div','ci'); const ct=el('a','ct',c.title); ct.href=c.url; ct.target='_blank'; ct.rel='noopener'; ct.style.color='inherit';
      ci.append(ct, el('div','cc',`${c.foil?'Foil · ':''}${priceText(c)} each`));
      const r=el('div','row'); const minus=el('button',null,c.qty>1?'−':'🗑'); const plus=el('button',null,'+');
      minus.onclick=()=>{if(c.qty>1)c.qty--;else cart=cart.filter(z=>z!==c);saveCart();renderCart();render()};
      plus.onclick=()=>{c.qty++;saveCart();renderCart();render()};
      r.append(minus, el('span',null,String(c.qty)), plus); ci.appendChild(r);
      row.append(ci, el('div','cp',money(c.price*c.qty))); box.appendChild(row);
    }
    grand+=sub;
    const st=el('div','subtotal'); st.append(el('span',null,'Subtotal from'), el('span',null,money(sub))); box.appendChild(st);
    const co=el('button','checkout',`Open ${its.length} item${its.length>1?'s':''} at ${s.name}`); co.style.width='100%'; co.style.border='0'; co.style.cursor='pointer';
    co.onclick=()=>{for(const c of its) window.open(c.url,'_blank','noopener')};
    box.appendChild(co); P.appendChild(box);
  }
  const g=el('div','grand'); g.append(el('span',null,'Total from, all stores'), el('span',null,money(grand))); P.appendChild(g);
  P.appendChild(el('p','note','Prices are the lowest listed for each printing, so the condition you pick at the store may cost more. Each store has its own checkout. The button opens each item\'s page so you can pick a condition and add it to that store\'s cart. Allow pop-ups the first time.'));
  const clr=el('button','btn ghost','Empty cart'); clr.onclick=()=>{cart=[];saveCart();renderCart();render()}; P.appendChild(clr);
}
function openCart(){renderCart();$('drawer').classList.add('open')}
function closeCart(){$('drawer').classList.remove('open')}
$('fab').onclick=openCart; $('scrim').onclick=closeCart;

// ---------- recent ----------
function saveRecent(its){
  const title=its.length===1?its[0].name:`${its[0].name} + ${its.length-1} more`;
  recent=[{title,text:list.value,at:Date.now()},...recent.filter(x=>x.text!==list.value)].slice(0,10);store.set('recent',recent);renderRecent()}
function renderRecent(){
  const r=$('recent');r.innerHTML='';
  if(!recent.length){r.appendChild(el('div','empty','Your searches show up here.'));return}
  for(const x of recent){const b=el('button');b.append(el('span',null,x.title),el('span','when',ago(x.at)));
    b.onclick=()=>{list.value=x.text;save();window.scrollTo({top:0,behavior:'smooth'});runSearch()};r.appendChild(b)}
}
function ago(t){const m=Math.round((Date.now()-t)/60000);if(m<1)return'just now';if(m<60)return m+'m ago';const h=Math.round(m/60);if(h<24)return h+'h ago';return new Date(t).toLocaleDateString()}

let saveT;function save(){clearTimeout(saveT);saveT=setTimeout(()=>store.set('list',list.value),200)}
$('searchBtn').onclick=runSearch;
$('clearAll').onclick=()=>{list.value='';data={};done.clear();store.set('done',[]);save();render();list.focus()};

// ---------- autocomplete (Scryfall) ----------
const sug=$('suggest');let sugItems=[],sugIdx=-1,sugT,sugReq=0;
function curLine(){const v=list.value,p=list.selectionStart;const a=v.lastIndexOf('\n',p-1)+1;let b=v.indexOf('\n',p);if(b<0)b=v.length;return{a,b,text:v.slice(a,b)}}
function hideSug(){sug.style.display='none';sugItems=[];sugIdx=-1}
function showSug(){
  sug.innerHTML='';if(!sugItems.length){hideSug();return}
  sugItems.forEach((n,i)=>{const b=el('button',i===sugIdx?'on':null,n);b.type='button';b.onmousedown=e=>{e.preventDefault();pick(n)};sug.appendChild(b)});
  const lines=list.value.slice(0,list.selectionStart).split('\n').length;
  const lh=parseFloat(getComputedStyle(list).lineHeight)||23;
  sug.style.top=Math.min(10+lines*lh+4-list.scrollTop, list.offsetHeight+10)+'px';sug.style.display='block';
}
function pick(n){const {a,b,text}=curLine();const m=text.match(/^(\s*\d+\s*x?\s+)/i);const pre=m?m[1]:'';
  const v=list.value;const ins=pre+n;const after=v.slice(b);const nl=after.startsWith('\n')?'':'\n';
  list.value=v.slice(0,a)+ins+nl+after;const pos=a+ins.length+1;list.setSelectionRange(pos,pos);hideSug();save();render();list.focus()}
list.addEventListener('input',()=>{save();render();clearTimeout(sugT);
  const p=parse(curLine().text);const q=p?p.name:'';if(q.length<2){hideSug();return}
  sugT=setTimeout(async()=>{const id=++sugReq;
    try{const r=await fetch('https://api.scryfall.com/cards/autocomplete?q='+encodeURIComponent(q));const j=await r.json();
      if(id!==sugReq)return;sugItems=(j.data||[]).slice(0,8).filter(n=>n.toLowerCase()!==q.toLowerCase());sugIdx=-1;showSug()}catch(e){hideSug()}},160)});
list.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();hideSug();runSearch();return}
  if(sug.style.display!=='block')return;
  if(e.key==='ArrowDown'){e.preventDefault();sugIdx=(sugIdx+1)%sugItems.length;showSug()}
  else if(e.key==='ArrowUp'){e.preventDefault();sugIdx=(sugIdx-1+sugItems.length)%sugItems.length;showSug()}
  else if((e.key==='Enter'||e.key==='Tab')&&sugIdx>=0){e.preventDefault();pick(sugItems[sugIdx])}
  else if(e.key==='Escape')hideSug()});
list.addEventListener('blur',()=>setTimeout(hideSug,100));

renderChips();saveCart();render();renderRecent();
</script>
</body>
