name: Refresh nearby stores
# Rebuilds stores-ca.json (the map's list of Canadian game and card shops) from OpenStreetMap every Monday.
on:
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-stores.mjs
      - name: Commit if the list changed
        run: |
          if git diff --quiet -- stores-ca.json; then echo "No changes"; exit 0; fi
          git config user.name "card-hunt-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stores-ca.json
          git commit -m "Refresh nearby stores from OpenStreetMap"
          git push
